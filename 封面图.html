<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
html,body{margin:0;padding:0;width:800px;height:1000px;overflow:hidden}
*{box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:linear-gradient(155deg,#16304F 0%,#1F3A5F 45%,#24405F 100%);
  position:relative;overflow:hidden;color:#fff;
}
body::before{
  content:"";position:absolute;right:-140px;top:-120px;width:520px;height:520px;border-radius:50%;
  border:1px solid rgba(255,255,255,.07);
}
body::after{
  content:"";position:absolute;right:40px;top:60px;width:280px;height:280px;border-radius:50%;
  border:1px solid rgba(255,122,61,.32);
}
.glow{
  position:absolute;right:60px;top:-60px;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,122,61,.30) 0%,rgba(255,122,61,0) 62%);
}
.wrap{position:relative;z-index:2;padding:64px 64px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;letter-spacing:.22em;color:rgba(255,255,255,.66)}
.brand i{width:9px;height:9px;border-radius:50%;background:#FF7A3D;display:block}
/* 大标题：跨全宽一行，中文 | 英文 */
.titlerow{display:flex;align-items:center;gap:18px;margin-top:26px}
.titlerow h1{
  font-family:"Songti SC","Noto Serif SC",Georgia,serif;
  font-size:72px;line-height:1.1;font-weight:700;margin:0;letter-spacing:.02em;
  white-space:nowrap;
}
.titlerow .vbar{width:2px;height:62px;flex:0 0 2px;border-radius:1px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.55),rgba(255,255,255,.12))}
.titlerow .en{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:26px;font-weight:600;letter-spacing:.22em;line-height:1.4;color:rgba(255,255,255,.88);text-transform:uppercase;white-space:nowrap}
.tag{font-size:23px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:18px;font-weight:600;letter-spacing:.06em}
/* 中部：飞轮 + 说明 */
.hero{display:flex;align-items:center;gap:38px;margin-top:22px}
.fly{width:230px;height:230px;flex:0 0 230px}
.fly text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.col{flex:1;min-width:0}
.sub{font-size:18px;line-height:1.9;color:rgba(255,255,255,.66);max-width:400px}
.sub em{font-style:normal;color:rgba(255,255,255,.94);font-weight:600}
.rule{width:78px;height:4px;background:#FF7A3D;border-radius:2px;margin:34px 0 28px}
.cards{display:flex;gap:16px;margin-top:2px}
.c{
  flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:14px;padding:26px 20px;
}
.c .n{font-family:"Songti SC",Georgia,serif;font-size:14px;color:#FF7A3D;letter-spacing:.14em;font-weight:700}
.c h3{font-size:24px;font-weight:700;margin:8px 0 9px;font-family:"Songti SC",Georgia,serif}
.c p{font-size:14.5px;line-height:1.62;color:rgba(255,255,255,.66)}
.foot{
  position:absolute;left:64px;right:64px;bottom:56px;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid rgba(255,255,255,.14);padding-top:24px;
}
.foot .quote{font-size:17px;line-height:1.6;color:rgba(255,255,255,.86);max-width:500px;font-family:"Songti SC",Georgia,serif}
.foot .badge{text-align:right;font-size:14px;color:rgba(255,255,255,.55);line-height:1.7}
.foot .badge b{display:block;color:#FF7A3D;font-size:16px;letter-spacing:.08em;font-weight:700}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <span class="brand"><i></i>每日飞轮 · 做一件小事</span>
  <div class="titlerow">
    <h1>做一件小事</h1>
    <span class="vbar"></span>
    <span class="en">Build in Public</span>
  </div>
  <div class="tag">写一点 · 复盘一次 · 拍一条</div>
  <div class="hero">
    <svg class="fly" viewBox="0 0 320 320" aria-label="每日飞轮">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="40s" repeatCount="indefinite"/>
        <circle cx="160" cy="160" r="146" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1.4"/>
        <circle cx="160" cy="160" r="132" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.4"/>
      </g>
      <path d="M82.9 68.1 A120 120 0 0 1 237.1 68.1" fill="none" stroke="#FF7A3D" stroke-width="8" stroke-linecap="round" opacity=".92"/>
      <path d="M251.9 82.9 A120 120 0 0 1 251.9 237.1" fill="none" stroke="#FF7A3D" stroke-width="8" stroke-linecap="round" opacity=".92"/>
      <path d="M237.1 251.9 A120 120 0 0 1 82.9 251.9" fill="none" stroke="#FF7A3D" stroke-width="8" stroke-linecap="round" opacity=".92"/>
      <path d="M68.1 237.1 A120 120 0 0 1 68.1 82.9" fill="none" stroke="#FF7A3D" stroke-width="8" stroke-linecap="round" opacity=".92"/>
      <path d="M239.9 70.2 L238.1 73.5 L243.2 68.4 Z" fill="#FF7A3D"/>
      <path d="M249.8 239.9 L246.5 238.1 L251.6 243.2 Z" fill="#FF7A3D"/>
      <path d="M80.1 249.8 L81.9 246.5 L76.8 251.6 Z" fill="#FF7A3D"/>
      <path d="M70.2 80.1 L73.5 81.9 L68.4 76.8 Z" fill="#FF7A3D"/>
      <circle cx="160" cy="40" r="20" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="2"/>
      <circle cx="280" cy="160" r="20" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="2"/>
      <circle cx="160" cy="280" r="20" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="2"/>
      <circle cx="40" cy="160" r="20" fill="rgba(255,255,255,.10)" stroke="#fff" stroke-width="2"/>
      <circle cx="160" cy="160" r="66" fill="rgba(255,122,61,.16)" stroke="#FF7A3D" stroke-width="1.5"/>
      <text x="160" y="153" text-anchor="middle" fill="#FF7A3D" font-size="30" font-weight="700" font-family="Songti SC,serif">越转</text>
      <text x="160" y="186" text-anchor="middle" fill="#FF7A3D" font-size="30" font-weight="700" font-family="Songti SC,serif">越快</text>
      <text x="160" y="15" text-anchor="middle" fill="rgba(255,255,255,.9)" font-size="13" font-weight="600">写一点</text>
      <text x="280" y="210" text-anchor="middle" fill="rgba(255,255,255,.9)" font-size="13" font-weight="600">复盘</text>
      <text x="160" y="314" text-anchor="middle" fill="rgba(255,255,255,.9)" font-size="13" font-weight="600">拍一条</text>
      <text x="40" y="210" text-anchor="middle" fill="rgba(255,255,255,.9)" font-size="13" font-weight="600">方法库</text>
    </svg>
    <div class="col">
      <p class="sub">把一件事做成，从<em>做一件有价值的小事</em>开始：发现问题 → 解决问题 → 做成了，把方法分享出去。每天把这三件事转完一圈，越转越快。</p>
    </div>
  </div>
  <div class="rule"></div>
  <div class="cards">
    <div class="c">
      <div class="n">01</div>
      <h3>写一点</h3>
      <p>不知道写啥？给题。<br>发现什么、怎么办、<br>对别人有啥用。</p>
    </div>
    <div class="c">
      <div class="n">02</div>
      <h3>复盘一次</h3>
      <p>做成了啥、没做成啥、<br>卡在哪、<br>明天第一件事。</p>
    </div>
    <div class="c">
      <div class="n">03</div>
      <h3>拍一条</h3>
      <p>大白话写下来，<br>自动出口播稿<br>和拍摄提醒。</p>
    </div>
  </div>
</div>
<div class="foot">
  <div class="quote">从一件有价值的小事开始，做成了就把它分享出去。</div>
  <div class="badge">
    <b>不联网 · 不上传 · 不收费</b>
    双击即用 · 手机也能开
  </div>
</div>
</body>
</html>
