<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>2027 每日记事本 · 丁未年</title>
<style>/* ============ 2027 每日记事本 · 版式与主题 ============ */
:root{
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(30,26,20,.04),0 8px 30px rgba(30,26,20,.045);
  --season:#8a9a78;
  /* 兜底值：悬浮挂件 / 弹层在 .app 之外，无法继承 .app[data-theme] 上的变量。
     applyTheme() 会把当前主题变量镜像到 :root，这里保证镜像前也不会透明。 */
  --bg:#efeae0; --paper:#fbf8f1; --card:#fffdf8; --ink:#26231f; --ink2:#5c554b; --ink3:#948c7f;
  --line:#ded6c7; --accent:#9c463c; --accent-soft:#f4e8e3; --gold:#b08d57; --side:#f5f0e6;
}
/* 六套主题 */
.app[data-theme="xuan"]{--bg:#efeae0;--paper:#fbf8f1;--card:#fffdf8;--ink:#26231f;--ink2:#5c554b;--ink3:#948c7f;--line:#ded6c7;--accent:#9c463c;--accent-soft:#f4e8e3;--gold:#b08d57;--side:#f5f0e6}
.app[data-theme="wu"]{--bg:#e8eeea;--paper:#f7faf8;--card:#ffffff;--ink:#22302c;--ink2:#52645e;--ink3:#8a9a92;--line:#d3e0d8;--accent:#4f7a68;--accent-soft:#e4f0e9;--gold:#9c8a5a;--side:#eef4f0}
.app[data-theme="ye"]{--bg:#101826;--paper:#172236;--card:#1c2940;--ink:#eef2f8;--ink2:#b6c1d2;--ink3:#7f8ca3;--line:#2b3a52;--accent:#d9b36c;--accent-soft:#2a3446;--gold:#d9b36c;--side:#141e30;--shadow:0 1px 2px rgba(0,0,0,.18),0 10px 34px rgba(0,0,0,.22)}
.app[data-theme="mu"]{--bg:#eee9ef;--paper:#faf7fb;--card:#ffffff;--ink:#332a38;--ink2:#635669;--ink3:#9b8ea0;--line:#e0d6e3;--accent:#7d6089;--accent-soft:#f0e8f3;--gold:#b1885f;--side:#f4eef5}
.app[data-theme="sha"]{--bg:#f0e9df;--paper:#fcf7ee;--card:#fffdf8;--ink:#3b3028;--ink2:#6a5b4e;--ink3:#a19486;--line:#e3d7c5;--accent:#a86a3d;--accent-soft:#f6e9dc;--gold:#c19a5b;--side:#f6efe5}
.app[data-theme="jian"]{--bg:#f2f3f4;--paper:#ffffff;--card:#ffffff;--ink:#1d1f21;--ink2:#5f666e;--ink3:#99a0a6;--line:#e4e7e9;--accent:#2f6f8f;--accent-soft:#e7f0f5;--gold:#8e9aa2;--side:#f8f9fa}
.app[data-season="spring"]{--season:#6f9268}
.app[data-season="summer"]{--season:#b46b42}
.app[data-season="autumn"]{--season:#b8893f}
.app[data-season="winter"]{--season:#5b7a9c}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#efeae0;color:#26231f;font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(circle at 18% 12%,rgba(255,255,255,.32),transparent 42%),radial-gradient(circle at 82% 78%,rgba(0,0,0,.025),transparent 45%)}
.app[data-theme="ye"]{background-image:radial-gradient(circle at 20% 10%,rgba(217,179,108,.06),transparent 40%)}

/* ---------- 侧栏 ---------- */
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);
  padding:26px 20px 18px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:42px;height:42px;flex:0 0 42px;border-radius:5px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;
  letter-spacing:0;white-space:nowrap;line-height:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.32)}
.brand h1{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:.06em;font-weight:600}
.brand p{margin:3px 0 0;font-size:11px;color:var(--ink3);letter-spacing:.14em}
.side-label{font-size:10px;letter-spacing:.22em;color:var(--ink3);margin:0 0 8px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;border-radius:var(--r-sm);
  background:transparent;text-align:left;font-size:13px;color:var(--ink2);transition:.18s}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button.on{background:var(--paper);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.nav .ic{font-size:15px;width:18px;text-align:center;opacity:.85}
.side-search{position:relative}
.side-search input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);font-size:12.5px;outline:none}
.side-search input:focus{border-color:var(--accent)}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.theme-dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;position:relative;
  box-shadow:0 1px 4px rgba(0,0,0,.12)}
.theme-dot.on{border-color:var(--accent);transform:scale(1.12)}
.theme-dot span{position:absolute;inset:3px;border-radius:50%;background:rgba(255,255,255,.55)}
.side-foot{margin-top:auto;font-size:11px;line-height:1.75;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px}
.save-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--season);margin-right:6px}

/* ---------- 主区 ---------- */
.main{padding:26px 38px 80px;max-width:1240px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.crumb{font-family:var(--serif);font-size:15px;color:var(--ink2);letter-spacing:.04em}
.crumb b{color:var(--ink);font-weight:600}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink2);padding:7px 13px;border-radius:var(--r-sm);
  font-size:12.5px;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:11.5px}

/* 通用卡片/标题 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sec-h .bar{width:3px;height:15px;background:var(--accent);border-radius:2px}
.sec-h h2{font-family:var(--serif);font-size:16px;margin:0;letter-spacing:.08em;font-weight:600}
.sec-h .en{font-size:10px;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase}
.sec-h .sp{margin-left:auto}
.muted{color:var(--ink3)}
.tiny{font-size:11px}

/* ---------- 日视图 ---------- */
.day-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,1fr);gap:0;overflow:hidden;margin-bottom:18px}
.hero-left{padding:26px 30px;position:relative}
.big-date{display:flex;align-items:flex-end;gap:16px}
.big-num{font-family:Georgia,var(--serif);font-size:80px;line-height:.86;letter-spacing:-.05em;font-weight:400}
.big-meta{padding-bottom:6px}
.big-meta .ym{font-family:var(--serif);font-size:22px;letter-spacing:.04em}
.big-meta .wk{font-size:12px;color:var(--ink3);margin-top:5px;letter-spacing:.12em}
.lunar-line{margin-top:16px;font-family:var(--serif);font-size:13.5px;color:var(--ink2);letter-spacing:.06em}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:var(--paper)}
.badge.hot{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge.term{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.off{background:var(--season);color:#fff;border-color:transparent}
.badge.work{border-style:dashed;color:var(--accent)}
.hero-right{padding:26px 28px;border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:16px;justify-content:center}
.progress-wrap{margin-top:auto}
.progress-top{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:7px}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--season),var(--accent));border-radius:6px;transition:width .5s}

.strip{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 22px;margin-bottom:18px}
.w-icon{font-size:26px;line-height:1}
.w-temp{font-family:Georgia,serif;font-size:27px}
.w-main{display:flex;align-items:center;gap:10px}
.w-desc{font-size:12.5px;color:var(--ink2)}
.w-grid{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;font-size:11.5px;color:var(--ink2)}
.w-grid b{font-weight:600;color:var(--ink)}
.w-off{font-size:12px;color:var(--ink3)}
.city-pick{border:1px solid var(--line);background:transparent;border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--ink2)}

.triad{display:grid;grid-template-columns:1.12fr 1fr 1fr;gap:16px;margin-bottom:18px}
.triad .card{padding:20px 22px;display:flex;flex-direction:column;min-height:272px}
.card-kicker{font-size:10px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-kicker:after{content:"";flex:1;height:1px;background:var(--line)}
.poem-title{font-family:var(--serif);font-size:20px;letter-spacing:.06em;margin-bottom:4px}
.poem-author{font-size:11.5px;color:var(--ink3);margin-bottom:15px}
.poem-body{font-family:var(--serif);font-size:15px;line-height:2.05;letter-spacing:.04em;color:var(--ink);white-space:pre-line}
.poem-note{margin-top:auto;padding-top:14px;font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--line);line-height:1.7}
.quote-body{font-family:var(--serif);font-size:17px;line-height:1.95;letter-spacing:.03em;flex:1}
.quote-src{margin-top:14px;font-size:11.5px;color:var(--accent);text-align:right}
.word-list{display:flex;flex-direction:column;gap:0;flex:1}
.word-row{padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.word-row:last-child{border-bottom:0}
.word-top{display:flex;align-items:baseline;gap:8px}
.word-en{font-family:Georgia,serif;font-size:15.5px;letter-spacing:.01em}
.word-pos{font-size:10.5px;color:var(--ink3)}
.word-cn{font-size:12px;color:var(--ink2);margin-left:auto}
.word-ex{display:none;font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:4px;font-style:italic}
.word-row.open .word-ex{display:block}
.card-foot{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.omen{padding:16px 22px;margin-bottom:18px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.omen-tag{font-family:var(--serif);font-size:15px;letter-spacing:.1em;color:var(--accent);border-right:1px solid var(--line);padding-right:20px}
.omen-main{display:flex;gap:26px;flex-wrap:wrap;align-items:center;font-size:12.5px;line-height:1.9}
.omen-main b{font-family:var(--serif);color:var(--ink);font-size:13px;margin-right:6px}
.omen-note{font-family:var(--serif);font-size:13.5px;color:var(--ink2);width:100%}
.omen-lucky{text-align:center;font-size:11px;color:var(--ink3);white-space:nowrap}
.lucky-dot{width:22px;height:22px;border-radius:50%;margin:0 auto 5px;border:2px solid rgba(255,255,255,.6);box-shadow:0 0 0 1px var(--line)}

/* 书写区 */
.write-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px}
.write-card{padding:20px 22px;margin-bottom:16px}
.task3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:block}
.field .lab{display:block;font-size:11px;letter-spacing:.1em;color:var(--ink3);margin-bottom:7px}
.line-in{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 2px;
  font-size:13.5px;outline:none;border-radius:0;transition:.2s}
.line-in:focus{border-color:var(--accent)}
.line-in::placeholder{color:var(--ink3);opacity:.75}
textarea.area{width:100%;min-height:210px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);
  background:transparent;padding:14px 16px;line-height:2.05;font-family:var(--serif);font-size:14.5px;outline:none;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 28px,var(--line) 29px,transparent 30px);
  background-attachment:local}
textarea.area:focus{border-color:var(--accent)}
textarea.area::placeholder{color:var(--ink3);opacity:.65}
.counter{text-align:right;font-size:11px;color:var(--ink3);margin-top:6px}
.three-lines{display:flex;flex-direction:column;gap:9px}
.scale-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.scale-row .lab{font-size:12px;color:var(--ink2);min-width:52px}
.stars{display:flex;gap:4px}
.star{width:22px;height:22px;border:1px solid var(--line);background:transparent;border-radius:5px;font-size:12px;
  line-height:1;color:var(--ink3);padding:0}
.star.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.num-in{width:66px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;font-size:13px;outline:none;text-align:center}
.num-in:focus{border-color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 14px}
.metric{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3)}
.metric .num-in{width:58px}
.habits{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.habit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;user-select:none}
.habit input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.habit.on{background:var(--accent-soft);border-color:transparent}
.day-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.day-nav .today-info{font-size:11.5px;color:var(--ink3)}

/* ---------- 月视图 ---------- */
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.month-title{font-family:var(--serif);font-size:28px;letter-spacing:.1em}
.month-title span{font-family:Georgia,serif;color:var(--accent);font-size:20px;margin-left:8px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:120px;padding:14px 16px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.stat .v{font-family:Georgia,serif;font-size:24px;color:var(--accent)}
.stat .k{font-size:11px;color:var(--ink3);margin-top:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .wd{background:var(--paper);text-align:center;padding:10px 0;font-size:11px;color:var(--ink3);letter-spacing:.1em}
.cal .cell{background:var(--card);min-height:92px;padding:9px 10px;position:relative;cursor:pointer;transition:.15s;border:0;text-align:left;display:flex;flex-direction:column}
.cal .cell:hover{background:var(--accent-soft)}
.cal .cell.blank{background:var(--paper);cursor:default;opacity:.55}
.cal .cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .cell.sel{background:var(--accent-soft)}
.cal .d-num{font-family:Georgia,serif;font-size:19px}
.cal .d-lunar{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.45}
.cal .d-fest{font-size:10.5px;color:var(--accent);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .cell.holiday .d-num{color:var(--accent)}
.cal .dot{position:absolute;right:9px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--season)}
.cal .cell.makeup:before{content:"班";position:absolute;left:9px;bottom:8px;font-size:9px;color:var(--accent);border:1px dashed var(--accent);border-radius:3px;padding:0 2px}

/* ---------- 年视图 ---------- */
.year-top{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-bottom:18px}
.year-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mini{padding:12px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.18s}
.mini:hover{transform:translateY(-2px);border-color:var(--accent)}
.mini h3{font-family:var(--serif);font-size:13px;margin:0 0 8px;letter-spacing:.08em}
.mini h3 span{float:right;color:var(--ink3);font-size:10px;font-weight:400}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-grid i{aspect-ratio:1;border-radius:2px;background:var(--line);opacity:.55}
.mini-grid i.has{background:var(--season);opacity:1}
.mini-grid i.fest{background:var(--accent);opacity:.8}
.mini-grid i.blank{background:transparent;opacity:0}
.year-goals{display:flex;flex-direction:column;gap:12px}
.year-goals textarea{min-height:88px;font-size:13.5px}
.search-res{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.search-item{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12.5px;cursor:pointer}
.search-item:hover{border-color:var(--accent)}
.search-item .d{color:var(--accent);font-family:Georgia,serif;margin-right:10px}

/* ---------- 设置 / 关于 ---------- */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.set-card{padding:20px 22px}
.set-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.set-row .lab{font-size:12px;color:var(--ink2);min-width:82px}
.set-row input[type=text],.set-row input[type=number],.set-row select{border:1px solid var(--line);background:var(--paper);
  border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px;outline:none;max-width:100%}
.set-row input:focus,.set-row select:focus{border-color:var(--accent)}
.set-row input[type=text]{flex:1;min-width:120px}
.habit-edit{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.about{font-size:12.5px;line-height:1.95;color:var(--ink2)}
.about h4{font-family:var(--serif);font-size:14px;margin:16px 0 6px;color:var(--ink)}
.about ul{padding-left:18px;margin:6px 0}
.about code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:24px;font-size:12.5px;z-index:99;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.print-only{display:none}

/* ---------- 响应式 ---------- */
@media(max-width:1080px){
  .triad{grid-template-columns:1fr 1fr}
  .triad .card:first-child{grid-column:1 / -1;min-height:auto}
  .write-grid{grid-template-columns:1fr}
  .year-mini{grid-template-columns:repeat(3,1fr)}
  .duo{grid-template-columns:1fr}
  .rev-grid{grid-template-columns:1fr}
}
@media(max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .brand h1{font-size:16px;white-space:nowrap}.brand p,.side-label,.side-foot,.side-search{display:none}
  .side > div:not(.brand){display:none}
  .nav,.themes{display:none}
  .main{padding:18px 16px 60px;min-width:0}
  .day-hero{grid-template-columns:1fr}.hero-right{border-left:0;border-top:1px solid var(--line)}
  .triad{grid-template-columns:1fr}.triad .card:first-child{grid-column:auto}
  .set-grid,.year-top{grid-template-columns:1fr}
  .year-mini{grid-template-columns:repeat(2,1fr)}
  .pet-stage{grid-template-columns:1fr;text-align:center}
  .pet-portrait{margin:0 auto}
  .pet-info{text-align:left}
  .task3{grid-template-columns:1fr}
  .cal .cell{min-height:64px;padding:5px}.cal .d-lunar{display:none}
  .big-num{font-size:52px}
  .w-grid{margin-left:0}
  .topbar{gap:8px;margin-bottom:14px;min-width:0}
  .crumb{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
  .tools{gap:6px;min-width:0}
  .tools .btn{padding:6px 9px;font-size:11.5px}
  .day-hero{margin-bottom:12px}
  .hero-left{padding:18px 20px}
  .hero-right{padding:14px 20px;gap:10px}
  .hero-right .tiny.muted{display:none}
  .day-tabs-tip{padding-right:76px}
  html,body{overflow-x:hidden;max-width:100%}
  .side{width:100%;max-width:100vw;box-sizing:border-box}
  .topbar{width:100%;max-width:100%;min-width:0}
  .topbar-right{width:100%;max-width:100%;min-width:0;flex-wrap:wrap}
  .tools{flex:1 1 calc(100% - 24px);min-width:0;max-width:100%;flex-wrap:wrap}
  .menu-btn{flex:0 0 auto}
}
@media(max-width:480px){.year-mini{grid-template-columns:1fr}.cal .cell{min-height:52px}.cal .d-fest{font-size:9px}}

/* ---------- 复盘 / 趋势 / 年度书 ---------- */
.rev-tabs{display:flex;gap:8px;flex-wrap:wrap}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.rev-grid .card{margin:0}
.habits-rate{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.habits-rate .hr{display:flex;align-items:center;gap:10px;font-size:13px}
.habits-rate .hr .lab{width:64px;flex:0 0 64px;color:var(--ink2)}
.habits-rate .hr .bar{flex:1;height:8px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.habits-rate .hr .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.habits-rate .hr .v{width:40px;flex:0 0 40px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.grat-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.grat-list .g{background:var(--accent-soft);color:var(--ink);padding:5px 11px;border-radius:20px;font-size:12.5px}
.mood-svg{width:100%;height:auto;display:block;margin-top:6px}
.mood-svg .grid{stroke:var(--line);stroke-width:1}
.mood-svg .line-m{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.mood-svg .line-e{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-dasharray:4 3;stroke-linejoin:round;stroke-linecap:round}
.mood-svg .dot-m{fill:var(--accent)}
.mood-svg .ax{fill:var(--ink3);font-size:10px}
.mood-svg .ax.end{text-anchor:end}
.legend{display:flex;gap:16px;align-items:center;margin-top:8px}
.legend .lg{font-size:12.5px}.legend .lg.m{color:var(--accent)}.legend .lg.e{color:var(--gold)}
.city-quick{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.city-quick .city-chip{border:1px solid var(--line);background:var(--paper);color:var(--ink2);padding:3px 10px;border-radius:14px;font-size:12px;cursor:pointer}
.city-quick .city-chip:hover{border-color:var(--accent);color:var(--accent)}
.city-quick .city-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 年度书 */
.book{font-family:var(--serif)}
.book-cover{text-align:center;padding:64px 24px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;break-after:page}
.bc-kicker{font-size:16px;letter-spacing:.32em;color:var(--accent);margin-bottom:18px}
.bc-title{font-size:40px;font-weight:700;letter-spacing:.12em;margin-bottom:12px}
.bc-sub{font-size:15px;color:var(--ink3);letter-spacing:.16em;margin-bottom:26px}
.bc-meta{font-size:13px;color:var(--ink2)}
.bc-foot{display:flex;justify-content:space-between;gap:20px;margin-top:48px;font-size:13px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:16px}
.book-page{padding:20px 26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;break-inside:avoid}
.bp-h{font-size:20px;letter-spacing:.1em;margin:0 0 14px}
.bp-block{margin-bottom:16px}.bp-block b{display:block;color:var(--accent);font-size:13px;letter-spacing:.1em;margin-bottom:5px}
.bp-block p{margin:0;line-height:2;font-size:14px}
.book-month{padding:18px 20px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;break-inside:avoid}
.bm-h{font-size:18px;letter-spacing:.1em;margin:0 0 4px}
.bm-sub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.bd{border-top:1px dashed var(--line);padding:10px 0}
.bd:first-of-type{border-top:0}
.bd-h{display:flex;align-items:baseline;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.bd-d{font-size:19px;font-weight:700;font-family:var(--serif)}
.bd-w{font-size:12px;color:var(--ink3)}
.bd-f{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:10px}
.bd-l{font-size:12px;color:var(--ink3);margin-left:auto}
.bd-content{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}
.bd-side{font-size:12px;color:var(--ink2);border-right:1px solid var(--line);padding-right:14px;line-height:1.9}
.bd-poem b{font-size:13.5px;color:var(--ink)}.bd-poem em{font-style:normal;color:var(--ink3);font-size:11px}
.bd-quote{margin:7px 0;color:var(--accent);font-size:12.5px;line-height:1.7}
.bd-words{color:var(--ink3);line-height:1.85}.bd-words i{font-style:normal;color:var(--ink3)}
.bd-main{font-size:13px;line-height:1.95}.bd-main p{margin:0 0 6px}.bd-main b{color:var(--accent)}
.bd-empty{color:var(--ink3);font-style:italic}

/* ---------- 高级感微调 ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 60%),var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.app[data-theme="ye"] .card{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 60%),var(--card)}
.sec-h h2{background:linear-gradient(90deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.month-title{background:linear-gradient(90deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
.big-num{background:linear-gradient(150deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav button.on{background:linear-gradient(180deg,var(--paper),var(--accent-soft))}
.btn.primary{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.crumb b{font-family:var(--serif)}

/* ---------- 历史上的今天 / 每日一技 ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.duo .card{padding:20px 22px;min-height:188px;display:flex;flex-direction:column}
.hist-list{display:flex;flex-direction:column;gap:9px;overflow:auto;flex:1}
.hist{display:flex;gap:10px;align-items:baseline;font-size:12.5px;line-height:1.7;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.hist:last-child{border-bottom:0;padding-bottom:0}
.hist-y{font-family:Georgia,serif;color:var(--accent);font-size:13px;flex:0 0 46px;font-variant-numeric:tabular-nums}
.hist-t{color:var(--ink2)}
.kn-cat{align-self:flex-start;font-size:10.5px;letter-spacing:.18em;color:#fff;background:var(--season);padding:3px 10px;border-radius:20px;text-transform:uppercase}
.kn-title{font-family:var(--serif);font-size:18px;letter-spacing:.04em;margin:12px 0 8px;color:var(--ink)}
.kn-body{font-size:12.5px;line-height:1.95;color:var(--ink2);flex:1}
.kn-body:after{content:"";display:block}

/* ---------- 回顾 / 查询 ---------- */
.memo-bar{display:flex;gap:8px;align-items:center}
.memo-bar input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:8px 11px;font-size:13px;outline:none}
.memo-bar input:focus{border-color:var(--accent)}
.memo-sec{margin-bottom:20px}
.memo-sec-h{font-family:var(--serif);font-size:15px;letter-spacing:.1em;color:var(--ink);margin-bottom:11px;
  display:flex;align-items:center;gap:8px}
.memo-sec-h span{font-size:11px;color:var(--ink3);font-family:var(--sans)}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.memo-card{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:12px 13px;cursor:pointer;transition:.18s}
.memo-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.mc-top{display:flex;align-items:baseline;gap:8px}
.mc-d{font-family:Georgia,serif;font-size:20px;color:var(--accent)}
.mc-w{font-size:11px;color:var(--ink3)}
.mc-mood{margin-left:auto;font-size:11px;color:var(--gold);letter-spacing:1px}
.mc-sub{font-size:10.5px;color:var(--ink3);margin:4px 0 7px}
.mc-snip{font-size:11.5px;color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 电子宠物 ---------- */
.topbar-right{display:flex;align-items:center;gap:12px}
.net-dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);position:relative}
.net-dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent}
.net-dot.on{background:#46b06a}.net-dot.on:after{border-color:rgba(70,176,106,.3)}
.net-dot.off{background:#c08a3a}.net-dot.off:after{border-color:rgba(192,138,58,.3)}
.pet-stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 30px;margin-bottom:18px}
.pet-portrait{width:140px;height:140px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,var(--accent-soft),transparent 70%);border-radius:24px}
.pet-svg{width:118px;height:118px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pet-info{flex:1}
.pet-name{font-family:var(--serif);font-size:21px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.pet-name .btn{font-size:11px;padding:3px 8px}
.pet-desc{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.pet-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pb-lab{width:36px;flex:0 0 36px;font-size:12px;color:var(--ink2)}
.pb-track{flex:1;height:10px;border-radius:8px;background:var(--accent-soft);overflow:hidden}
.pb-fill{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--season),var(--accent));transition:width .5s}
.pb-fill.mid{background:linear-gradient(90deg,#d9b36c,#c08a3a)}
.pb-fill.low{background:linear-gradient(90deg,#d98a8a,#c05858)}
.pb-num{width:30px;flex:0 0 30px;text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pet-exp{font-size:11.5px;color:var(--ink3);margin-top:4px}
.pet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pet-actions .btn{padding:10px 18px;font-size:13px}
/* 悬浮挂件 */
.pet-widget{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60}
.pw-body{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;position:relative;cursor:pointer;transition:.18s}
.pw-body:hover{transform:scale(1.06)}
.pw-body .pet-svg{width:48px;height:48px;animation:none}
.pw-lv{position:absolute;right:-2px;top:-2px;font-size:9px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 5px;font-family:var(--sans)}
.pw-mood{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-size:9.5px;color:var(--ink3);white-space:nowrap}
.pw-bubble{width:30px;height:30px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:14px;box-shadow:var(--shadow);cursor:pointer}
.pw-bubble:hover{transform:scale(1.1)}
/* 接星星小游戏 */
.pet-game{position:fixed;inset:0;background:rgba(20,18,14,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.pg-panel{width:min(440px,92vw);background:var(--card);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.pg-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:16px;margin-bottom:8px}
.pg-score{font-size:13px;color:var(--ink2);margin-bottom:12px}
.pg-score b{color:var(--accent);font-size:16px}
.pg-field{position:relative;height:300px;background:var(--accent-soft);border-radius:14px;overflow:hidden}
.pg-star{position:absolute;font-size:30px;border:0;background:transparent;cursor:pointer;line-height:1;
  animation:fall linear forwards;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.pg-star:hover{transform:scale(1.2)}
@keyframes fall{0%{transform:translateY(-30px)}100%{transform:translateY(330px)}}
.pg-pop{position:absolute;font-size:13px;color:var(--accent);font-weight:700;pointer-events:none;animation:pop .5s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.pg-tip{font-size:11px;color:var(--ink3);margin-top:10px;text-align:center}
.pg-result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card)}
.pg-r-score{font-family:Georgia,serif;font-size:54px;color:var(--accent)}
.pg-r-sub{font-size:13px;color:var(--ink2)}

/* ---------- 小猴助理 · 右下角快速查询 ---------- */
/* 悬浮层都在 .app 之外，body 的文字色是硬编码的深色；这里统一改用主题变量，
   否则切到「夜航·蓝」深色纸时，弹层里的文字会看不清。 */
.pet-widget,.pet-game,.monkey-dock,.monkey-panel,#toast{color:var(--ink)}
.monkey-dock{position:fixed;right:110px;bottom:20px;z-index:61;display:flex;flex-direction:column;align-items:center}
.monkey-body{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);padding:0;position:relative;cursor:pointer;transition:.2s}
.monkey-body:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 12px 28px rgba(0,0,0,.16)}
.monkey-svg{width:48px;height:48px;display:block;margin:6px auto 0}
.monkey-tag{position:absolute;left:50%;top:-17px;transform:translateX(-50%);font-size:9.5px;
  color:var(--ink2);white-space:nowrap;letter-spacing:.06em;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.monkey-body::after{content:"";position:absolute;right:3px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--season);border:2px solid var(--card)}
.monkey-panel{position:fixed;inset:0;background:rgba(24,20,16,.42);display:flex;align-items:center;
  justify-content:center;z-index:210;padding:20px;color:var(--ink)}
.monkey-panel[hidden]{display:none}
.mk-modal{width:min(720px,94vw);max-height:86vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 70px rgba(0,0,0,.3)}
.mk-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);
  font-family:var(--serif);font-size:17px}
.mk-head b{font-weight:600}
.mk-net{margin-left:auto;font-size:11px;color:var(--ink2);background:var(--accent-soft);
  border:1px solid var(--line);padding:4px 10px;border-radius:20px;white-space:nowrap}
.mk-bar{display:flex;gap:10px;padding:16px 20px 10px}
.mk-bar input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);font-size:14px;outline:none}
.mk-bar input:focus{border-color:var(--accent)}
.mk-chips{padding:0 20px 8px;display:flex;flex-wrap:wrap;gap:8px}
.mk-result{padding:12px 20px 24px;min-height:140px}
.mk-empty{color:var(--ink3);font-size:13px;line-height:1.95;padding:14px 2px}
.mk-empty b{color:var(--ink2);font-weight:600}
.mk-sec{margin-bottom:16px}
.mk-sec-h{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600;
  border-left:3px solid var(--accent);padding-left:9px;margin:0 0 9px}
.mk-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 13px;margin-bottom:7px;font-size:13px;line-height:1.8}
.mk-item b{font-weight:600}
.mk-item em{font-style:normal;color:var(--ink3);font-size:12px}
.mk-item i{font-style:normal;color:var(--accent);font-size:11.5px}
.mk-item span{color:var(--ink2)}
.mk-diary{cursor:pointer;transition:.15s}
.mk-diary:hover{border-color:var(--accent);background:var(--accent-soft)}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px}
.mk-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 8px;text-align:center;cursor:pointer;transition:.15s;line-height:1.5}
.mk-card:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.mk-card b{display:block;font-family:var(--serif);font-size:16px}
.mk-card span{font-size:11px;color:var(--ink3)}
.mk-card i{display:block;font-style:normal;color:var(--gold);font-size:11px;margin-top:2px;letter-spacing:1px}
.mk-date{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 2px}
.mk-date input{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
/* 年度书封面 · 年份寄语 */
.bc-wish{font-family:var(--serif);font-size:16px;color:var(--accent);line-height:1.95;
  margin:24px auto 4px;max-width:80%;font-style:italic}
@media(max-width:780px){
  .monkey-dock{right:80px;bottom:16px}
  .monkey-body{width:52px;height:52px}
  .monkey-svg{width:42px;height:42px;margin:5px auto 0}
  .mk-modal{width:100%;max-height:92vh}
  .mk-head,.mk-bar,.mk-chips,.mk-result{padding-left:14px;padding-right:14px}
  .mk-head{flex-wrap:wrap}
  .bc-title{font-size:30px}
  .bc-wish{font-size:14px;max-width:92%}
}

/* ---------- 打印 ---------- */
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important;color:#111!important}
  .app{display:block;background:#fff!important}
  .side,.topbar,.no-print,.btn,.day-nav,#toast{display:none!important}
  .main{padding:0;max-width:none}
  .card{box-shadow:none!important;border-color:#ddd!important;break-inside:avoid}
  .day-hero,.triad,.strip,.omen,.write-grid{break-inside:avoid}
  .triad{grid-template-columns:1.1fr 1fr 1fr}
  .triad .card:first-child{grid-column:auto;min-height:auto}
  .write-grid{grid-template-columns:1.15fr .85fr}
  textarea.area{display:none}
  .print-only{display:block;white-space:pre-wrap;font-family:var(--serif);font-size:13px;line-height:2;
    min-height:180px;padding:10px;border:1px solid #e2e2e2;border-radius:6px;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#eee 28px,transparent 29px)}
  .line-in{border-bottom:1px solid #ccc}
  .word-ex{display:block!important;font-style:normal}

  {t:'生查子·元夕', a:'欧阳修', d:'宋', tag:'festival', fest:'元宵节', c:['去年元夜时，花市灯如昼。','月上柳梢头，人约黄昏后。','今年元夜时，月与灯依旧。','不见去年人，泪湿春衫袖。'], n:'同样的灯，不同的人和年。'},
  {t:'清明', a:'杜牧', d:'唐', tag:'festival', fest:'清明|清明假期', c:['清明时节雨纷纷，路上行人欲断魂。','借问酒家何处有，牧童遥指杏花村。'], n:'雨、路、一个遥指，画面就活了。'},
  {t:'寒食', a:'韩翃', d:'唐', tag:'festival', fest:'清明', c:['春城无处不飞花，寒食东风御柳斜。','日暮汉宫传蜡烛，轻烟散入五侯家。'], n:'写满城飞花，只用了十四个字。'},
  {t:'端午', a:'文秀', d:'唐', tag:'festival', fest:'端午节', c:['节分端午自谁言，万古传闻为屈原。','堪笑楚江空渺渺，不能洗得直臣冤。'], n:'一个节日，记的是一个人的骨气。'},
  {t:'鹊桥仙', a:'秦观', d:'宋', tag:'festival', fest:'七夕', c:['纤云弄巧，飞星传恨，银汉迢迢暗度。','金风玉露一相逢，便胜却人间无数。','柔情似水，佳期如梦，忍顾鹊桥归路。','两情若是久长时，又岂在朝朝暮暮。'], n:'把「长久」从朝夕里拎了出来。'},
  {t:'水调歌头（节选）', a:'苏轼', d:'宋', tag:'festival', fest:'中秋节', c:['明月几时有？把酒问青天。','不知天上宫阙，今夕是何年。','人有悲欢离合，月有阴晴圆缺，此事古难全。','但愿人长久，千里共婵娟。'], n:'不圆满，也可以是祝福。'},
  {t:'望月怀远', a:'张九龄', d:'唐', tag:'festival', fest:'中秋节', c:['海上生明月，天涯共此时。','情人怨遥夜，竟夕起相思。','灭烛怜光满，披衣觉露滋。','不堪盈手赠，还寝梦佳期。'], n:'一句「共此时」，把距离缩短了。'},
  {t:'十五夜望月', a:'王建', d:'唐', tag:'festival', fest:'中秋节', c:['中庭地白树栖鸦，冷露无声湿桂花。','今夜月明人尽望，不知秋思落谁家。'], n:'秋思落谁家——落在一个「落」字上。'},
  {t:'静夜思', a:'李白', d:'唐', tag:'festival', fest:'中秋节', c:['床前明月光，疑是地上霜。','举头望明月，低头思故乡。'], n:'最熟的句子，往往最经得起重读。'},
  {t:'九月九日忆山东兄弟', a:'王维', d:'唐', tag:'festival', fest:'重阳节', c:['独在异乡为异客，每逢佳节倍思亲。','遥知兄弟登高处，遍插茱萸少一人。'], n:'「少一人」，全诗的分量都在这里。'},
  {t:'过故人庄', a:'孟浩然', d:'唐', tag:'festival', fest:'重阳节', c:['故人具鸡黍，邀我至田家。','绿树村边合，青山郭外斜。','开轩面场圃，把酒话桑麻。','待到重阳日，还来就菊花。'], n:'最好的约定，是「还来」。'},

  /* ---------- 春 ---------- */
  {t:'春晓', a:'孟浩然', d:'唐', tag:'spring', c:['春眠不觉晓，处处闻啼鸟。','夜来风雨声，花落知多少。'], n:'不写花，只问落了多少。'},
  {t:'咏柳', a:'贺知章', d:'唐', tag:'spring', c:['碧玉妆成一树高，万条垂下绿丝绦。','不知细叶谁裁出，二月春风似剪刀。'], n:'把春风想象成一把剪刀。'},
  {t:'早春呈水部张十八员外', a:'韩愈', d:'唐', tag:'spring', c:['天街小雨润如酥，草色遥看近却无。','最是一年春好处，绝胜烟柳满皇都。'], n:'早春的美，在「近却无」。'},
  {t:'绝句·迟日江山丽', a:'杜甫', d:'唐', tag:'spring', c:['迟日江山丽，春风花草香。','泥融飞燕子，沙暖睡鸳鸯。'], n:'二十个字，四种感官。'},
  {t:'江畔独步寻花·其六', a:'杜甫', d:'唐', tag:'spring', c:['黄四娘家花满蹊，千朵万朵压枝低。','留连戏蝶时时舞，自在娇莺恰恰啼。'], n:'「自在」两个字，是春天的心情。'},
  {t:'春夜喜雨', a:'杜甫', d:'唐', tag:'spring', c:['好雨知时节，当春乃发生。','随风潜入夜，润物细无声。','野径云俱黑，江船火独明。','晓看红湿处，花重锦官城。'], n:'真正有用的力量，常常不出声。'},
  {t:'钱塘湖春行', a:'白居易', d:'唐', tag:'spring', c:['孤山寺北贾亭西，水面初平云脚低。','几处早莺争暖树，谁家新燕啄春泥。','乱花渐欲迷人眼，浅草才能没马蹄。','最爱湖东行不足，绿杨阴里白沙堤。'], n:'一路走一路看，春天是被走出来的。'},
  {t:'忆江南', a:'白居易', d:'唐', tag:'spring', c:['江南好，风景旧曾谙。','日出江花红胜火，春来江水绿如蓝。','能不忆江南？'], n:'两色对举，记忆就有了颜色。'},
  {t:'惠崇春江晚景', a:'苏轼', d:'宋', tag:'spring', c:['竹外桃花三两枝，春江水暖鸭先知。','蒌蒿满地芦芽短，正是河豚欲上时。'], n:'冷暖这种事，靠谁最先知道。'},
  {t:'春日', a:'朱熹', d:'宋', tag:'spring', c:['胜日寻芳泗水滨，无边光景一时新。','等闲识得东风面，万紫千红总是春。'], n:'「一时新」，是重新看世界的样子。'},
  {t:'村居', a:'高鼎', d:'清', tag:'spring', c:['草长莺飞二月天，拂堤杨柳醉春烟。','儿童散学归来早，忙趁东风放纸鸢。'], n:'一个「忙」字，写活了放学。'},
  {t:'游园不值', a:'叶绍翁', d:'宋', tag:'spring', c:['应怜屐齿印苍苔，小扣柴扉久不开。','春色满园关不住，一枝红杏出墙来。'], n:'门没开，春天也没被关住。'},
  {t:'泊船瓜洲', a:'王安石', d:'宋', tag:'spring', c:['京口瓜洲一水间，钟山只隔数重山。','春风又绿江南岸，明月何时照我还。'], n:'一个「绿」字，改了很久。'},
  {t:'鸟鸣涧', a:'王维', d:'唐', tag:'spring', c:['人闲桂花落，夜静春山空。','月出惊山鸟，时鸣春涧中。'], n:'静到能听见花落。'},
  {t:'相思', a:'王维', d:'唐', tag:'spring', c:['红豆生南国，春来发几枝。','愿君多采撷，此物最相思。'], n:'不说想念，只说多采一点。'},
  {t:'滁州西涧', a:'韦应物', d:'唐', tag:'spring', c:['独怜幽草涧边生，上有黄鹂深树鸣。','春潮带雨晚来急，野渡无人舟自横。'], n:'无人之处，自有秩序。'},
  {t:'题都城南庄', a:'崔护', d:'唐', tag:'spring', c:['去年今日此门中，人面桃花相映红。','人面不知何处去，桃花依旧笑春风。'], n:'物还在，人已非，春天不管这些。'},
  {t:'晚春', a:'韩愈', d:'唐', tag:'spring', c:['草树知春不久归，百般红紫斗芳菲。','杨花榆荚无才思，惟解漫天作雪飞。'], n:'连最不起眼的，也在认真谢幕。'},
  {t:'春江花月夜（节选）', a:'张若虚', d:'唐', tag:'spring', c:['春江潮水连海平，海上明月共潮生。','滟滟随波千万里，何处春江无月明！','人生代代无穷已，江月年年望相似。'], n:'把一代人的短暂，放进江月的长久里。'},

  /* ---------- 夏 ---------- */
  {t:'晓出净慈寺送林子方', a:'杨万里', d:'宋', tag:'summer', c:['毕竟西湖六月中，风光不与四时同。','接天莲叶无穷碧，映日荷花别样红。'], n:'两种颜色，撑起整个六月。'},
  {t:'小池', a:'杨万里', d:'宋', tag:'summer', c:['泉眼无声惜细流，树阴照水爱晴柔。','小荷才露尖尖角，早有蜻蜓立上头。'], n:'「才露」与「早有」，是恰好的时机。'},
  {t:'饮湖上初晴后雨', a:'苏轼', d:'宋', tag:'summer', c:['水光潋滟晴方好，山色空蒙雨亦奇。','欲把西湖比西子，淡妆浓抹总相宜。'], n:'晴也好，雨也好，各有各的好。'},
  {t:'六月二十七日望湖楼醉书', a:'苏轼', d:'宋', tag:'summer', c:['黑云翻墨未遮山，白雨跳珠乱入船。','卷地风来忽吹散，望湖楼下水如天。'], n:'一阵暴雨，来得快去得也快。'},
  {t:'西江月·夜行黄沙道中', a:'辛弃疾', d:'宋', tag:'summer', c:['明月别枝惊鹊，清风半夜鸣蝉。','稻花香里说丰年，听取蛙声一片。','七八个星天外，两三点雨山前。','旧时茅店社林边，路转溪桥忽见。'], n:'「忽见」，是走路的人才有惊喜。'},
  {t:'约客', a:'赵师秀', d:'宋', tag:'summer', c:['黄梅时节家家雨，青草池塘处处蛙。','有约不来过夜半，闲敲棋子落灯花。'], n:'等人的时间，被一个动作写尽了。'},
  {t:'夏日南亭怀辛大（节选）', a:'孟浩然', d:'唐', tag:'summer', c:['山光忽西落，池月渐东上。','散发乘夕凉，开轩卧闲敞。','荷风送香气，竹露滴清响。'], n:'夏夜的凉，是闻见和听见的。'},
  {t:'山亭夏日', a:'高骈', d:'唐', tag:'summer', c:['绿树阴浓夏日长，楼台倒影入池塘。','水晶帘动微风起，满架蔷薇一院香。'], n:'风先动帘，香随后到。'},
  {t:'夏意', a:'苏舜钦', d:'宋', tag:'summer', c:['别院深深夏席清，石榴开遍透帘明。','树阴满地日当午，梦觉流莺时一声。'], n:'正午的静，被一声莺啼点破。'},
  {t:'三衢道中', a:'曾几', d:'宋', tag:'summer', c:['梅子黄时日日晴，小溪泛尽却山行。','绿阴不减来时路，添得黄鹂四五声。'], n:'回程不无聊，多了几声鸟。'},
  {t:'所见', a:'袁枚', d:'清', tag:'summer', c:['牧童骑黄牛，歌声振林樾。','意欲捕鸣蝉，忽然闭口立。'], n:'从「唱」到「闭口」，一秒的戏。'},
  {t:'采莲曲', a:'王昌龄', d:'唐', tag:'summer', c:['荷叶罗裙一色裁，芙蓉向脸两边开。','乱入池中看不见，闻歌始觉有人来。'], n:'人融进荷塘，靠歌声才被找到。'},
  {t:'爱莲说（节选）', a:'周敦颐', d:'宋', tag:'summer', c:['予独爱莲之出淤泥而不染，濯清涟而不妖，','中通外直，不蔓不枝，香远益清，亭亭净植，','可远观而不可亵玩焉。'], n:'一篇短文，写的是一种站姿。'},

  /* ---------- 秋 ---------- */
  {t:'山居秋暝', a:'王维', d:'唐', tag:'autumn', c:['空山新雨后，天气晚来秋。','明月松间照，清泉石上流。','竹喧归浣女，莲动下渔舟。','随意春芳歇，王孙自可留。'], n:'「自可留」，是决定留下来。'},
  {t:'秋夕', a:'杜牧', d:'唐', tag:'autumn', c:['银烛秋光冷画屏，轻罗小扇扑流萤。','天阶夜色凉如水，卧看牵牛织女星。'], n:'凉的是夜色，也是心境。'},
  {t:'山行', a:'杜牧', d:'唐', tag:'autumn', c:['远上寒山石径斜，白云生处有人家。','停车坐爱枫林晚，霜叶红于二月花。'], n:'深秋不输早春，甚至更艳。'},
  {t:'登高', a:'杜甫', d:'唐', tag:'autumn', c:['风急天高猿啸哀，渚清沙白鸟飞回。','无边落木萧萧下，不尽长江滚滚来。','万里悲秋常作客，百年多病独登台。','艰难苦恨繁霜鬓，潦倒新停浊酒杯。'], n:'个人的迟暮，对着不尽的长江。'},
  {t:'望洞庭', a:'刘禹锡', d:'唐', tag:'autumn', c:['湖光秋月两相和，潭面无风镜未磨。','遥望洞庭山水翠，白银盘里一青螺。'], n:'把一整片湖，收进一只银盘。'},
  {t:'秋词', a:'刘禹锡', d:'唐', tag:'autumn', c:['自古逢秋悲寂寥，我言秋日胜春朝。','晴空一鹤排云上，便引诗情到碧霄。'], n:'同一季节，可以换一种说法。'},
  {t:'枫桥夜泊', a:'张继', d:'唐', tag:'autumn', c:['月落乌啼霜满天，江枫渔火对愁眠。','姑苏城外寒山寺，夜半钟声到客船。'], n:'一夜无眠，靠钟声收尾。'},
  {t:'天净沙·秋思', a:'马致远', d:'元', tag:'autumn', c:['枯藤老树昏鸦，小桥流水人家，','古道西风瘦马。','夕阳西下，断肠人在天涯。'], n:'几乎全是名词，情绪却满了。'},
  {t:'暮江吟', a:'白居易', d:'唐', tag:'autumn', c:['一道残阳铺水中，半江瑟瑟半江红。','可怜九月初三夜，露似真珠月似弓。'], n:'一个「铺」字，光就贴在水面。'},
  {t:'夜书所见', a:'叶绍翁', d:'宋', tag:'autumn', c:['萧萧梧叶送寒声，江上秋风动客情。','知有儿童挑促织，夜深篱落一灯明。'], n:'远处一盏灯，抵过一江秋风。'},
  {t:'饮酒·其五', a:'陶渊明', d:'东晋', tag:'autumn', c:['结庐在人境，而无车马喧。','问君何能尔？心远地自偏。','采菊东篱下，悠然见南山。','山气日夕佳，飞鸟相与还。','此中有真意，欲辨已忘言。'], n:'心远了，住哪儿都安静。'},
  {t:'秋思', a:'张籍', d:'唐', tag:'autumn', c:['洛阳城里见秋风，欲作家书意万重。','复恐匆匆说不尽，行人临发又开封。'], n:'「又开封」，写了所有没说尽的话。'},
  {t:'苏幕遮（节选）', a:'范仲淹', d:'宋', tag:'autumn', c:['碧云天，黄叶地，秋色连波，波上寒烟翠。','山映斜阳天接水，芳草无情，更在斜阳外。'], n:'颜色一层层铺开，秋就有了高度。'},
  {t:'相见欢', a:'李煜', d:'五代', tag:'autumn', c:['无言独上西楼，月如钩。','寂寞梧桐深院锁清秋。','剪不断，理还乱，是离愁。','别是一般滋味在心头。'], n:'说不清的，才最难放下。'},
  {t:'峨眉山月歌', a:'李白', d:'唐', tag:'autumn', c:['峨眉山月半轮秋，影入平羌江水流。','夜发清溪向三峡，思君不见下渝州。'], n:'二十八字里，走了五处地名。'},

  /* ---------- 冬 ---------- */
  {t:'江雪', a:'柳宗元', d:'唐', tag:'winter', c:['千山鸟飞绝，万径人踪灭。','孤舟蓑笠翁，独钓寒江雪。'], n:'天地空了，还有一个人没走。'},
  {t:'梅花', a:'王安石', d:'宋', tag:'winter', c:['墙角数枝梅，凌寒独自开。','遥知不是雪，为有暗香来。'], n:'看不见的香，成了证据。'},
  {t:'逢雪宿芙蓉山主人', a:'刘长卿', d:'唐', tag:'winter', c:['日暮苍山远，天寒白屋贫。','柴门闻犬吠，风雪夜归人。'], n:'一句「归人」，雪夜就暖了。'},
  {t:'白雪歌送武判官归京（节选）', a:'岑参', d:'唐', tag:'winter', c:['北风卷地白草折，胡天八月即飞雪。','忽如一夜春风来，千树万树梨花开。'], n:'把最冷的景，写成最盛的春。'},
  {t:'问刘十九', a:'白居易', d:'唐', tag:'winter', c:['绿蚁新醅酒，红泥小火炉。','晚来天欲雪，能饮一杯无？'], n:'最动人的邀请，只有一个问句。'},
  {t:'别董大', a:'高适', d:'唐', tag:'winter', c:['千里黄云白日曛，北风吹雁雪纷纷。','莫愁前路无知己，天下谁人不识君。'], n:'风雪里送人，给的是底气。'},
  {t:'冬夜读书示子聿', a:'陆游', d:'宋', tag:'winter', c:['古人学问无遗力，少壮工夫老始成。','纸上得来终觉浅，绝知此事要躬行。'], n:'读到最后，还是要动手。'},
  {t:'卜算子·咏梅', a:'陆游', d:'宋', tag:'winter', c:['驿外断桥边，寂寞开无主。','已是黄昏独自愁，更著风和雨。','无意苦争春，一任群芳妒。','零落成泥碾作尘，只有香如故。'], n:'落成泥了，香还在。'},
  {t:'雪梅', a:'卢钺', d:'宋', tag:'winter', c:['梅雪争春未肯降，骚人搁笔费评章。','梅须逊雪三分白，雪却输梅一段香。'], n:'各有长短，不必分高下。'},
  {t:'终南望余雪', a:'祖咏', d:'唐', tag:'winter', c:['终南阴岭秀，积雪浮云端。','林表明霁色，城中增暮寒。'], n:'雪停了，城里反而更冷。'},

{c:'力学',t:'杠杆省力看力臂',b:'杠杆平衡：动力×动力臂 = 阻力×阻力臂。撬棍垫得越远（力臂越长），越省力，但手要移动更长的距离。'},
{c:'力学',t:'滑轮组怎么算',b:'用滑轮组提升重物，理想情况下「省几倍力」≈ 承担重物的绳子段数 n；拉绳移动距离 = n × 重物升高距离。'},
{c:'力学',t:'斜面让上楼变轻松',b:'把重物沿斜面推上去比直接抬省力，省力倍数 ≈ 斜面长 ÷ 斜面高。盘山公路、货梯坡道都是这个原理。'},
{c:'力学',t:'摩擦力不全是坏事',b:'走路、刹车、拧瓶盖都靠摩擦；太滑时撒沙、垫布增加摩擦，机械转动处加油减少摩擦。'},
{c:'力学',t:'重心低更稳',b:'物体重心越低、支撑面越大越不容易倒。高柜要固定上墙、不叠太高，就是这个道理。'},
{c:'力学',t:'惯性让急刹危险',b:'运动物体有保持原运动状态的性质。车速越快，刹停距离越长（约与速度平方成正比），所以雨天要拉大车距。'},
{c:'力学',t:'压强 = 力 ÷ 面积',b:'同样的力，接触面积越小压强越大：菜刀磨薄、图钉尖头、高跟鞋陷地，都是减小面积增压强；雪地走路宽鞋减小压强。'},
{c:'力学',t:'浮力与排开的水',b:'浸在液体里的物体受向上的浮力，大小等于它排开液体的重量（阿基米德原理）。船能浮是因为排开的水很重。'},
{c:'力学',t:'伯努利：流速快压强小',b:'飞机机翼上表面弯、气流快、压强小，上下压差产生升力；两辆并行快车会「吸」向彼此，也源于此。'},
{c:'力学',t:'功 = 力 × 距离',b:'把 10kg 东西举高 1 米做的功，约等于 100 焦耳；搬家和爬楼累，本质是持续对抗重力做功。'},
{c:'力学',t:'扭矩让扳手好使',b:'拧螺丝时，力作用在离转轴越远越省力——长扳手、加长套筒就是增大力臂、提高扭矩。'},
{c:'电学',t:'家庭电是交流电',b:'我国家庭插座是 220V、50Hz 交流电。火线带电、零线回路、地线保命（漏电时把电流导入大地）。'},
{c:'电学',t:'功率 = 电压 × 电流',b:'电器功率 W = 电压 V × 电流 A。一个 2200W 电热水壶约 10A；老旧排插标 10A 就别同时插多个大功率。'},
{c:'电学',t:'安培、伏特、欧姆',b:'电压像水压（推动电流），电流像水流，电阻像水管粗细。欧姆定律：电流 = 电压 ÷ 电阻。'},
{c:'电学',t:'短路很危险',b:'火线与零线直接碰一起电阻极小、电流剧增会起火。保险丝、空气开关、漏保都是为这种意外准备的，别乱接。'},
{c:'电学',t:'串联分压、并联分流',b:'串联的几个灯一个坏全不亮（圣诞灯老式）；并联的每个灯独立（家里灯）。电池串联升压、并联扩容。'},
{c:'电学',t:'锂电池别过充过放',b:'手机/充电宝用锂电，长期保持 20%–80% 最耐用；别整夜满充、别用到自动关机。高温是锂电杀手。'},
{c:'电学',t:'触电先断电再救人',b:'有人触电，第一反应是断开电源（拉闸、拔插头），用干燥木棍挑开电线，千万别湿手直接拉人。'},
{c:'电学',t:'万用表怎么用',b:'测电压用并联（红笔接被测点、黑笔接参考点）；测通断用蜂鸣档；测电流要串联进电路。量程宁大勿小。'},
{c:'电学',t:'接地和接零不一样',b:'接地是把设备外壳连大地，防漏电伤人；接零是接工作零线。家庭三脚插头的粗脚就是接地，别掰掉。'},
{c:'电学',t:'电容像小水库',b:'电容储存电荷、平滑电压，滤波去抖；闪光灯、相机、电机启动都靠它瞬间放电。断电后大电容仍有电，别直接摸。'},
{c:'电学',t:'省电看能效标识',b:'家电贴能效标签，一级最省电。空调、冰箱是「常开」大户，买一级比三级一年能省不少电费。'},
{c:'电脑',t:'Ctrl+Shift+Esc 开任务管理器',b:'卡死时点它直接看哪个程序占 CPU/内存，右键结束任务就能救回卡顿，比等鼠标转圈快。'},
{c:'电脑',t:'C 盘别塞满',b:'系统盘留 15% 以上空间才跑得顺。把微信/下载/文档改到 D、E 盘，定期清理临时文件（%temp%）。'},
{c:'电脑',t:'WPS/Office 自动保存',b:'在「选项—保存」里打开自动保存与恢复，设 5–10 分钟。断电丢稿时去「管理文档—恢复未保存」找。'},
{c:'电脑',t:'Ctrl+Z 撤销多步',b:'大多数软件能连续撤销；Ctrl+Y 重做。手滑删了一大段，第一时间 Ctrl+Z，别急着重打。'},
{c:'电脑',t:'双击文件名可批量改名',b:'选中一堆文件，按 F2 改第一个，回车后系统自动加 (1)(2)… 序号，批量整理照片/发票很快。'},
{c:'电脑',t:'网页全文快捷键',b:'很多网页 Ctrl+F 搜索关键词；Ctrl+加号放大、减号缩小；Ctrl+D 收藏；地址栏直接打字就能搜。'},
{c:'电脑',t:'截图不用第三方',b:'Win+Shift+S 框选截图直接进剪贴板；Win+PrintScreen 存整屏到图片文件夹。省一个截图软件。'},
{c:'电脑',t:'U 盘弹出再拔',b:'右下角点「安全删除硬件」再拔，避免正在写数据时拔出导致文件损坏或 U 盘变「需要格式化」。'},
{c:'电脑',t:'Wi-Fi 卡先重启路由',b:'网络慢/掉线，先拔路由电源等 10 秒再插；还不行把设备「忘记网络」重连。多数故障这步就解决。'},
{c:'电脑',t:'备份 3-2-1 原则',b:'重要资料留 3 份：2 份本地不同介质（硬盘+U盘）、1 份异地（网盘/另一处）。只存一份等于没备份。'},
{c:'电脑',t:'浏览器开无痕不存记录',b:'Ctrl+Shift+N 开无痕窗口，不记录浏览历史和登录态，临时查东西或共用电脑时用，关掉即清。'},
{c:'电脑',t:'键盘进水立刻断电',b:'笔记本洒水先关机、拔电、倒扣晾干至少 24 小时再开机；别急着按电源，短路烧主板。'},
{c:'CAD',t:'CAD 多按空格确认',b:'CAD 里很多命令输完参数按空格/回车等于确认；Esc 取消当前命令；命令行报错看最下一行。'},
{c:'CAD',t:'图层管理是基本功',b:'墙、门窗、标注、家具分图层，关掉不相关的层画图更清爽；打印时锁住不打印的层（设为不打印）。'},
{c:'CAD',t:'正交 F8 画横平竖直',b:'按 F8 开正交，线只能水平或竖直走；画户型、正交墙体必开，歪掉多半是忘记开。'},
{c:'CAD',t:'偏移 Offset 做平行',b:'画完一条墙线，用 OFFSET 输入厚度（如 240）往里/外偏一份，就是另一面墙，比重画快。'},
{c:'CAD',t:'TR 修剪 Trim 清多余',b:'TR 空格两下进入「全屏修剪」，点哪剪哪，清理相交多余的线段；配合 F 栏选可一次剪一排。'},
{c:'CAD',t:'块 Block 复用图形',b:'门、窗、图例做成块（B），插多少次都一个源，改块定义全体更新，图纸统一又省空间。'},
{c:'CAD',t:'标注样式一次设好',b:'在标注样式里统一字高、箭头、比例；图框放大时改全局比例即可，别一个个手改标注。'},
{c:'CAD',t:'SC 缩放按参照',b:'不知具体倍数时，SC 选「参照 R」，点两点量出现有长度、再输目标长度，图形按真实尺寸缩放。'},
{c:'CAD',t:'MA 格式刷',b:'MATCHPROP（MA）把源对象的图层、颜色、线型刷到目标，批量统一样式，比改属性面板快。'},
{c:'CAD',t:'PU 清理多余对象',b:'图越画越卡，PU（PURGE）清理没用到的块、图层、线型，文件立刻小一圈。'},
{c:'CAD',t:'布局空间出图更稳',b:'模型里 1:1 画，布局里放视口设比例出图，改图不用来回调打印比例，多人协作也规范。'},
{c:'PS',t:'Ctrl+J 复制图层',b:'选中图层 Ctrl+J 复制一份再改，原图永远留底；修图前先复制是铁律，错了好回退。'},
{c:'PS',t:'图层蒙版比橡皮好',b:'给图层加蒙版（ Alt+点蒙版图标得黑蒙版），用黑白画笔显隐，不破坏原像素，可反复改。'},
{c:'PS',t:'Ctrl+T 自由变换',b:'Ctrl+T 缩放/旋转/斜切，按住 Shift 等比例、Alt 从中心变；右键菜单里还有「扭曲」「透视」修变形。'},
{c:'PS',t:'钢笔工具抠图',b:'钢笔（P）沿边缘打点成路径，闭合后转选区，适合硬边、产品图；羽化 0.5–1 像素去白边。'},
{c:'PS',t:'色阶 Ctrl+L 调明暗',b:'Ctrl+L 拉黑白场滑块，图片立刻通透；中间灰滑块控对比，比瞎拉亮度更准。'},
{c:'PS',t:'Ctrl+Alt+G 剪贴蒙版',b:'上层只显示在下方图形范围内（如把照片塞进圆框），下层当容器，比蒙版更直观。'},
{c:'PS',t:'液化修脸要克制',b:'滤镜—液化推拉五官，幅度别太大；过度液化会「塑料感」，保留一点原生结构更自然。'},
{c:'PS',t:'动作 Action 批处理',b:'把重复操作录成动作，再用「批处理」一次性套到几百张图（改尺寸、加水印），省时神器。'},
{c:'PS',t:'智能对象可无损缩放',b:'右键转智能对象后再缩放、加滤镜，多次放大也不糊；导出前栅格化即可。'},
{c:'PS',t:'Ctrl+Shift+U 去色',b:'一键变黑白；想调灰度氛围，先去色再叠个暖色/冷色，比直接调饱和更可控。'},
{c:'PS',t:'内容识别填充',b:'框选一块瑕疵（电线、路人），Shift+F5 选「内容识别」，PS 自动用周围纹理补上，修天空杂物很灵。'},
{c:'生活',t:'微波炉别加热带壳蛋',b:'鸡蛋、板栗带壳微波会爆；加热液体别满杯，拿出时容易「过热水」突沸烫手，先搅拌。'},
{c:'生活',t:'冰箱食物分层放',b:'上层熟食、中层蛋奶、下层生肉（防汁水滴落污染）；叶菜套袋留口、热带水果别放冷藏（香蕉变黑）。'},
{c:'生活',t:'煮饭米水比例',b:'普通米饭米:水≈1:1.2（食指第一关节淹过米面）；粥更稀；陈米略多水，新米略少。'},
{c:'生活',t:'粘钩先擦干净再贴',b:'墙面去油去灰、完全干燥后贴，压紧 30 秒，24 小时后再挂重物，寿命长一倍。'},
{c:'生活',t:'白醋去水垢',b:'水壶、花洒的水垢是碳酸钙，白醋泡半小时一擦就掉；洗衣机槽、淋浴房同理，比买除垢剂便宜。'},
{c:'生活',t:'小苏打万能清洁',b:'小苏打+水成糊，擦灶台、瓷砖、锅底油污；加醋起泡能通轻微堵塞。便宜又不吃表面。'},
{c:'生活',t:'衣服掉色先盐水泡',b:'新深色衣服用淡盐水泡 30 分钟再洗，固色；反面晾、避暴晒，不容易褪成旧抹布。'},
{c:'生活',t:'叠衣服卷起来省空间',b:'T 恤、裤子卷成筒比叠放省地又防皱，旅行装箱尤其好用；袜子塞鞋里填形。'},
{c:'生活',t:'指甲刀磨钝用砂纸',b:'剪刀、指甲刀变钝，剪几下粗砂纸（或铝箔）能恢复锋利；别硬剪厚物。'},
{c:'生活',t:'蜡烛涂拉链防卡',b:'拉链涩了，用蜡烛或铅笔芯（石墨）在齿上擦几下，顺滑如新；别硬拽会把布扯坏。'},
{c:'生活',t:'柠檬去异味',b:'冰箱、微波炉、砧板的腥味，放切开的柠檬或一碗白醋水静置；下水道异味用小苏打+醋冲。'},
{c:'生活',t:'枕头晒完更蓬松',b:'羽绒/化纤枕每月晒一次、轻拍回弹；枕套一周洗，枕芯两月通风，防螨防黄。'},
{c:'生活',t:'胶带留尾好撕',b:'贴完胶带折个小角留把手，下次一扯就开；快递箱封口也这样，省指甲。'},
{c:'生活',t:'断电后先关电器',b:'停电再来电瞬间有浪涌，易烧坏电器；出门 long 时间或雷雨天，拔掉电视、电脑插头最稳。'},
{c:'生活',t:'洗手七步才干净',b:'内、外、夹、弓、大、立、腕，搓满 20 秒（两遍生日歌）；指甲缝、指根是细菌老窝。'},
{c:'健康',t:'饮水别等口渴',b:'口渴时身体已轻度缺水。成人一天约 1.5–2L，少量多次；尿色淡黄说明喝够了。'},
{c:'健康',t:'久坐每小时起来',b:'坐 1 小时起来走 2 分钟，护腰护颈椎、也利代谢；设个闹钟提醒自己。'},
{c:'健康',t:'深睡在半夜最深',b:'入睡后前半夜深睡最多，熬夜会砍掉最珍贵的深睡；尽量 23 点前睡，比补觉有用。'},
{c:'健康',t:'用眼 20-20-20',b:'看屏幕每 20 分钟，远眺 20 英尺（约 6 米）外 20 秒，缓解视疲劳，预防近视加深。'},
{c:'健康',t:'饭后别立刻躺',b:'吃完平躺易反酸；散散步、坐一会儿，至少等 20–30 分钟再午睡，胃也舒服。'},
{c:'健康',t:'拉伸比不拉伸好',b:'运动前后动态拉伸热身、静态拉伸放松，减少拉伤和第二天酸痛；久坐族常拉髋屈肌和胸。'},
{c:'健康',t:'BMI 只是粗指标',b:'体重÷身高² 算 BMI，18.5–24 正常；但肌肉多的人会偏高，要结合体脂和腰围看。'},
{c:'健康',t:'急救先 call 120',b:'突发胸痛、卒中、昏迷，第一时间打 120 说清地址和症状；心肺复苏按压深度 5–6cm、100–120 次/分。'},
{c:'健康',t:'防晒一年四季',b:'紫外线 UVA 穿透玻璃、致老，阴天也有；上班族脸和手也该涂，光老比皱纹更显年龄。'},
{c:'收纳',t:'收纳先断舍离',b:'先扔再收：一年没用、不心动、重复的，果断处理；收纳盒是替补，不是垃圾桶。'},
{c:'收纳',t:'竖向分隔抽屉',b:'抽屉里加分格（书立、分隔板），筷子、袜子、工具各归各位，拉开一目了然，不再翻找。'},
{c:'收纳',t:'垂直空间别浪费',b:'门后挂袋、墙面洞洞板、床下抽屉，把平面用成立体；小户型多出半间房。'},
{c:'收纳',t:'同色统一容器',b:'储物罐、收纳盒统一颜色款式，再乱也显整齐；透明盒看得到内容，省得开盖猜。'},
{c:'收纳',t:'一进一出原则',b:'买一件新物，处理一件旧的，家里总量不失控；这是防复乱的底层规则。'},
{c:'数码',t:'手机拍照用网格线',b:'设置开九宫格，主体放四分线交点更舒服；拍建筑竖线对齐网格，不歪。'},
{c:'数码',t:'充电到 80% 更护电池',b:'长期插着满电伤锂电极；夜间充电可设「智能充电/上限 80%」，出门前再充满。'},
{c:'数码',t:'重要照片多端备份',b:'手机照片自动同步云盘+定期导电脑/硬盘，手机丢了也不怕；别只存在手机里。'},
{c:'数码',t:'短信验证码别给任何人',b:'银行、平台验证码等于密码，官方绝不会索要；所谓「客服」要验证码，99% 是诈骗。'},
{c:'数码',t:'公共 Wi-Fi 别登账号',b:'咖啡厅、车站的免费 Wi-Fi 可能被嗅探，别在上面输密码、付钱；要用就开手机热点或流量。'},
{c:'数码',t:'App 权限最小化',b:'装 App 只给必要权限：导航要给定位、相机不用给通讯录；定期在设置里收回多余权限。'},
{c:'数码',t:'旧手机先退账号再卖',b:'卖掉/送人前退出 Apple ID / 华为/小米账号、恢复出厂、拔出 SIM 和卡，防被找回和泄露。'},
{c:'沟通',t:'先听再说',b:'别人说话时别急着反驳，等说完再回应；复述一句「你的意思是…」能少很多误会。'},
{c:'沟通',t:'批评对事不对人',b:'说「这份方案数据要再核」比「你怎么总出错」管用；把人和事分开，对方才听得进去。'},
{c:'沟通',t:'请求要具体',b:'「帮我看下周三能不能来」比「你有空吗」清楚；含糊的请求只会换来含糊的答应。'},
{c:'沟通',t:'坏消息别微信说',b:'辞退、分手、借钱被拒这类事，当面或电话比文字体面；文字没有语气，容易被误读。'},
{c:'沟通',t:'提问前先自查',b:'问别人前先搜一遍、看下文档，带着「我试过 X、卡在 Y」去问，别人更愿意帮。'},
{c:'沟通',t:'感谢要及时具体',b:'「谢谢你帮我接住那个客户」比「谢谢」有分量；具体化的感谢让人记得你靠谱。'},
{c:'时间',t:'番茄钟 25+5',b:'专注 25 分钟、休息 5 分钟，四轮后长休；把大任务切成小段，拖延症友好。'},
{c:'时间',t:'要事第一',b:'每天先吃掉最难的「青蛙」（重要不紧急的事），剩下的轻松事顺手清，别被琐事淹没。'},
{c:'时间',t:'两分钟法则',b:'一件事两分钟内能做完（回消息、丢垃圾），现在就做，别进待办清单增加管理成本。'},
{c:'时间',t:'睡前列明日三件',b:'晚上写下明天最重要的三件，早上不纠结从哪开始；和本子的「今日三件事」正好呼应。'},
{c:'时间',t:'批量处理同类事',b:'回邮件、打电话、跑腿集中一个时段做，减少切换成本；频繁跳来跳去最耗神。'},
{c:'理财',t:'先存后花',b:'工资到账先转一笔进储蓄/理财，再花剩下的；「付给自己」比月底剩多少算多少靠谱。'},
{c:'理财',t:'记账看清钱去哪',b:'记一个月账就知道自己钱花哪了；大头往往是外卖、打车、会员，砍掉两三个就回血。'},
{c:'理财',t:'应急金留 3–6 月',b:'留够 3–6 个月生活费随时可取，失业、生病不慌；别全拿去理财锁死。'},
{c:'理财',t:'远离高息诱惑',b:'「稳赚、日息高、拉人头返现」基本是坑；收益超 8% 就要警惕，承诺保本高息的多是骗局。'},
{c:'理财',t:'保险先保人再理财',b:'家庭顶梁柱先配齐医疗+意外+重疾，再考虑理财型；顺序错了保障是空的。'},
{c:'厨艺',t:'热锅冷油不粘',b:'锅烧到滴水成珠再下油，再下菜，不易粘；煎鱼、摊蛋尤其灵。'},
{c:'厨艺',t:'盐分步放更入味',b:'炒菜中途放盐更进味，出锅前尝味补一点；炖肉 early 放盐肉易老，后期调。'},
{c:'厨艺',t:'糖提鲜别怕甜',b:'少许糖能中和酸、压咸、提鲜，不是为甜；番茄炒蛋、红烧都靠它平衡。'},
{c:'厨艺',t:'焯水去草酸涩味',b:'菠菜、笋、豆角先焯水去草酸和涩毒；绿叶菜焯完过凉水保绿。'},
{c:'厨艺',t:'生熟分开防交叉',b:'切生肉的刀板别直接切熟食，细菌感染闹肚子；家里备两套最稳。'},
{c:'园艺',t:'多肉别老浇水',b:'多肉怕涝，土干透再浇、浇透；一月一两次足够，水多必烂根。'},
{c:'园艺',t:'绿萝好养又净气',b:'绿萝耐阴、水培土培都活，适合新手；叶大能吸附一点灰尘，摆书房客厅。'},
{c:'园艺',t:'浇水看土不看天',b:'别固定每天浇，手指插土 2cm 干了再浇；盆底积水要倒掉，防烂根。'},
{c:'出行',t:'长途前查胎压',b:'开车远行前看胎压（车门框有标准值）、备胎和机油；胎压足省油又稳。'},
{c:'出行',t:'红绿灯右转先看人',b:'右转车要让直行和行人，很多事故出在「我以为他停」。慢半秒不丢人。'},
{c:'出行',t:'行李分装随身重要物',b:'证件、药、充电宝、现金随身带；托运箱丢了也不误事。'},
{c:'出行',t:'高铁赶不上可改签',b:'误车别慌，开车前/后当天有余票可改签一次；机票看舱位退改规则，早处理少亏。'},

const YEAR = 2027;
const WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const CN_NUM = ['零','一','二','三','四','五','六','七','八','九','十'];
const DEFAULT_HABITS = ['早睡','阅读','运动','喝水','少刷手机','写日记'];
const THEMES = [
  ['xuan','宣纸·墨','#f5f0e6','#9c463c'], ['wu','晨雾·青','#eef4f0','#4f7a68'],
  ['ye','夜航·蓝','#172236','#d9b36c'], ['mu','暮山·紫','#f4eef5','#7d6089'],
  ['sha','砂金·棕','#f6efe5','#a86a3d'], ['jian','极简·灰','#ffffff','#2f6f8f']

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const dayNum = s => { const [y,m,d]=s.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d)/86400000); };
const diffDays = (a,b) => dayNum(b)-dayNum(a);
const addDays = (s,n) => { const d=new Date(Date.UTC(...(()=>{const [y,m,dd]=s.split('-').map(Number); return [y,m-1,dd];})())); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const toDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const isoOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const todayStr = () => isoOf(new Date());
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clampYear = s => (s>=`${YEAR}-01-01` && s<=`${YEAR}-12-31`) ? s : `${YEAR}-01-01`;

function lunarDayCN(n){
  if(n<10) return '初'+CN_NUM[n];
  if(n===10) return '初十';
  if(n<20) return '十'+CN_NUM[n-10];
  if(n===20) return '二十';
  if(n<30) return '廿'+CN_NUM[n-20];
  return '三十';
}
function seasonOf(s){
  const m=Number(s.slice(5,7));
  if(m>=3&&m<=5) return 'spring';
  if(m>=6&&m<=8) return 'summer';
  if(m>=9&&m<=11) return 'autumn';
  return 'winter';
}
const SEASON_CN = {spring:'春',summer:'夏',autumn:'秋',winter:'冬'};
function lunarOf(s){
  let hit=LUNAR_MONTHS[0];
  for(const row of LUNAR_MONTHS){ if(row[0]<=s) hit=row; else break; }
  const n=diffDays(hit[0],s)+1;
  return {month:hit[1], day:n, dayCN:lunarDayCN(n), year:hit[2], ganzhi:hit[4], zodiac:hit[3],
          text:`农历${hit[1]}${lunarDayCN(n)}`};
}
function holidayOf(s){
  for(const h of HOLIDAYS){ if(s>=h.start&&s<=h.end) return h; }
  return null;
}
function festivalsOf(s){
  const out=[];
  const sf=SOLAR_FESTIVALS[s.slice(5)];
  if(sf) out.push({name:sf.name,note:sf.note,kind:sf.kind});
  const lf=LUNAR_FESTIVALS[s];
  if(lf) out.push({name:lf.name,note:lf.note,kind:lf.kind});
  const wf=WEEK_FESTIVALS[s];
  if(wf) out.push({name:wf,note:'',kind:'day'});
  return out;
}
function infoOf(s){
  const dt=toDate(s);
  const doy=diffDays(`${YEAR}-01-01`,s)+1;
  return {
    s, dt, year:YEAR, month:Number(s.slice(5,7)), day:Number(s.slice(8,10)),
    week:dt.getDay(), weekCN:WEEK_CN[dt.getDay()],
    doy, left:365-doy, pct:Math.round(doy/365*1000)/10,
    lunar:lunarOf(s), term:SOLAR_TERMS[s]||'', festivals:festivalsOf(s),
    holiday:holidayOf(s), makeup:WORKDAYS_MAKEUP[s]||'', season:seasonOf(s)
  };
}

/* ---------- 状态 ---------- */
function defaultState(){
  return {
    entries:{},
    settings:{ theme:'xuan', seasonAuto:true, city:'长治', lat:36.1954, lon:113.1163,
               habits:DEFAULT_HABITS.slice() },
    year:{ keyword:'', goals:'', review:'', name:'', wish:'' },
    reviews:{},
    pet:{ hunger:70, mood:70, energy:70, level:1, exp:0, last:new Date().toISOString(), born:new Date().toISOString(), name:'豆豆' },
    weather:null
  };
}
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const o=JSON.parse(raw), d=defaultState();
    const pet=Object.assign({},d.pet,o.pet||{});
    return {
      entries:o.entries||{}, settings:Object.assign({},d.settings,o.settings||{}),
      year:Object.assign({},d.year,o.year||{}), reviews:o.reviews||{},
      pet, weather:o.weather||null
    };
  }catch(e){ return defaultState(); }
}
let state = loadState();
let cur = { view:'day', date:clampYear(todayStr()), month:Number(clampYear(todayStr()).slice(5,7)), query:'', reviewKind:'month' };
let saveTimer=null, weatherBusy=false;

function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); markSaved(true); }
  catch(e){ markSaved(false); }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,450); }
function markSaved(ok){
  const el=$('#saveState'); if(!el) return;
  const t=new Date();
  el.innerHTML=`<span class="save-dot"></span>${ok?`已保存 · ${pad(t.getHours())}:${pad(t.getMinutes())}`:'本机存储不可用，请及时导出备份'}`;
}
function entry(s){
  if(!state.entries[s]) state.entries[s]={};
  return state.entries[s];
}
function val(s,f){ return (state.entries[s]&&state.entries[s][f])||''; }
function textFields(s){
  const e=state.entries[s]||{}, keys=['t1','t2','t3','note','g1','g2','g3','good','better','tomorrow','tag'];
  return keys.reduce((n,k)=>n+String(e[k]||'').length,0);
}
function hasEntry(s){
  const e=state.entries[s]; if(!e) return false;
  return ['t1','t2','t3','note','g1','g2','g3','good','better','tomorrow','tag'].some(k=>String(e[k]||'').trim())
      || e.mood || e.energy || (e.habits||[]).some(Boolean);
}
function streakOf(base){
  let s=base, n=0;
  if(!hasEntry(s)) s=addDays(s,-1);
  while(s>=`${YEAR}-01-01` && hasEntry(s)){ n++; s=addDays(s,-1); }
  return n;
}

/* ---------- 每日内容（按年内第几天稳定选取） ---------- */
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rnd(seed,k){ let x=(seed ^ Math.imul(k+1,2654435761))>>>0; x^=x>>>16; x=Math.imul(x,2246822507); x^=x>>>13; return (Math.imul(x,3266489909)>>>0)/4294967296; }
function poemOf(info){
  const big=info.festivals.find(f=>f.kind==='big'||f.kind==='trad');
  if(big){
    const pool=POEMS.filter(p=>p.fest && p.fest.split('|').some(k=>big.name.indexOf(k)>=0||k.indexOf(big.name)>=0));
    if(pool.length) return pool[(info.doy-1)%pool.length];
  }
  const pool=POEMS.filter(p=>p.tag===info.season);
  return pool[(info.doy-1)%pool.length];
}
function quoteOf(info,shift=0){ return QUOTES[((info.doy-1+shift)%QUOTES.length+QUOTES.length)%QUOTES.length]; }
function wordsOf(info,count){
  const out=[], start=(info.doy-1)*6;
  for(let i=0;i<count;i++){
    const raw=WORDS[(start+i)%WORDS.length].split('|');
    out.push({w:raw[0],pos:raw[1],cn:raw[2],ex:raw[3]});
  }
  return out;
}
let quoteShift=0, wordCountShown=6;
function omenOf(info){
  const seed=hash(info.s), pick=(arr,k,off)=>arr[Math.floor(rnd(seed,k+off)*arr.length)];
  const a=pick(OMEN.yi,1,0), b=pick(OMEN.yi,7,11);
  return { yi:[a, b===a?pick(OMEN.yi,9,31):b], ji:pick(OMEN.ji,3,0),
           note:pick(OMEN.note,5,0), lucky:pick(OMEN.lucky,11,0),
           num:1+Math.floor(rnd(seed,13,0)*9) };
}
function historyOf(md){ return (HISTORY&&HISTORY[md])||[]; }
function knowledgeOf(doy){
  const idx=((doy-1)%KNOWLEDGE.length+KNOWLEDGE.length)%KNOWLEDGE.length;
  return KNOWLEDGE[idx];
}

/* ---------- 复盘 / 趋势 / 年度书 数据 ---------- */
const QUICK_CITIES = ['长治','太原','北京','西安','上海','广州','成都','深圳'];
function weekStartOf(s){ const dt=toDate(s); const back=(dt.getDay()+6)%7; return addDays(s,-back); }
function monthDates(m){
  const dim=new Date(YEAR,m,0).getDate(), out=[];
  for(let d=1;d<=dim;d++) out.push(`${YEAR}-${pad(m)}-${pad(d)}`);
  return out;
}
function weekDatesOf(s){
  const ws=weekStartOf(s), out=[];
  for(let k=0;k<7;k++){ const d=addDays(ws,k); if(d>=`${YEAR}-01-01`&&d<=`${YEAR}-12-31`) out.push(d); }
  return out;
}
function aggregate(dates){
  const keys=dates.filter(hasEntry);
  let chars=0, sumM=0,nM=0, sumE=0,nE=0, habitDen=0;
  const grat=[], tags=[], hc=(state.settings.habits||[]).map(()=>0);
  keys.forEach(k=>{
    const e=state.entries[k]; chars+=textFields(k);
    if(e.mood){ sumM+=Number(e.mood); nM++; }
    if(e.energy){ sumE+=Number(e.energy); nE++; }
    [e.g1,e.g2,e.g3].forEach(g=>{ if(g&&g.trim()) grat.push(g.trim()); });
    if(e.tag&&e.tag.trim()) tags.push(e.tag.trim());
    if(e.habits){ habitDen++; (state.settings.habits||[]).forEach((_,i)=>{ if(e.habits[i]) hc[i]++; }); }
  });
  const habits=(state.settings.habits||[]).map((h,i)=>({name:h,rate:habitDen?Math.round(hc[i]/habitDen*100):0}));
  return {n:keys.length, chars, moodAvg:nM?(sumM/nM).toFixed(1):'—', energyAvg:nE?(sumE/nE).toFixed(1):'—',
          gratitudes:grat.slice(0,14), tags:[...new Set(tags)].slice(0,12), habits};
}
function moodSeries(){
  const pts=[];
  for(let m=1;m<=12;m++){ const dim=new Date(YEAR,m,0).getDate();
    for(let d=1;d<=dim;d++){ const s=`${YEAR}-${pad(m)}-${pad(d)}`, e=state.entries[s];
      if(e&&e.mood) pts.push({doy:infoOf(s).doy, m:Number(e.mood), e:(e.energy?Number(e.energy):null)}); } }
  return pts;
}
function moodChartSVG(pts){
  const W=760,H=240, pl=30,pr=10,pt=14,pb=22, x0=pl,x1=W-pr,y0=pt,y1=H-pb;
  const X=doy=>x0+(doy-1)/364*(x1-x0), Y=v=>y1-(v-1)/4*(y1-y0);
  let g='';
  for(let v=1;v<=5;v++) g+=`<line x1="${x0}" y1="${Y(v)}" x2="${x1}" y2="${Y(v)}" class="grid"/>`;
  for(let m=1;m<=12;m++){ const doy=diffDays(`${YEAR}-01-01`,`${YEAR}-${pad(m)}-01`)+1;
    g+=`<line x1="${X(doy)}" y1="${y0}" x2="${X(doy)}" y2="${y1}" class="grid"/>`
      +`<text x="${X(doy)}" y="${H-7}" class="ax">${m}月</text>`; }
  const path=k=>pts.filter(p=>p[k]).map((p,i)=>`${i?'L':'M'}${X(p.doy).toFixed(1)} ${Y(p[k]).toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${X(p.doy).toFixed(1)}" cy="${Y(p.m).toFixed(1)}" r="2" class="dot-m"/>`).join('');
  const ePath=pts.some(p=>p.e)?`<path d="${path('e')}" class="line-e"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" class="mood-svg">
    ${g}<path d="${path('m')}" class="line-m"/>${ePath}${dots}
    <text x="${x0-4}" y="${y0+3}" class="ax end">5</text><text x="${x0-4}" y="${y1+3}" class="ax end">1</text></svg>`;
}
function dayBookHTML(e){
  if(!e) return '';
  const L=[];
  const t=[e.t1,e.t2,e.t3].filter(Boolean); if(t.length) L.push(`<p><b>三件事</b> ${t.map((x,k)=>`${k+1}. ${esc(x)}`).join('；')}</p>`);
  if(e.tag) L.push(`<p><b>关键词</b> ${esc(e.tag)}</p>`);
  if(e.note) L.push(`<p>${esc(e.note).replace(/\n/g,'<br>')}</p>`);
  const g=[e.g1,e.g2,e.g3].filter(Boolean); if(g.length) L.push(`<p><b>感恩</b> ${g.map(x=>'· '+esc(x)).join(' ')}</p>`);
  const rp=[['做得好',e.good],['更好',e.better],['明日一件',e.tomorrow]].filter(x=>x[1]);
  if(rp.length) L.push(`<p><b>复盘</b> ${rp.map(x=>`${x[0]}：${esc(x[1])}`).join('；')}</p>`);
  const sc=[['心情',e.mood],['精力',e.energy],['睡眠',e.sleep],['运动',e.exercise],['阅读',e.reading],['支出',e.spend]].filter(x=>x[1]);
  if(sc.length) L.push(`<p><b>刻度</b> ${sc.map(x=>`${x[0]} ${x[1]}`).join(' / ')}</p>`);
  const hab=(state.settings.habits||[]).filter((h,k)=>(e.habits||[])[k]); if(hab.length) L.push(`<p><b>打卡</b> ${hab.map(esc).join('、')}</p>`);
  if(e.wManual) L.push(`<p><b>天气</b> ${esc(e.wManual)}</p>`);
  return L.join('')||'<p class="bd-empty">（仅打卡，无文字）</p>';
}

/* ---------- 电子宠物（纯本地，无任何联网；状态随真实时间衰减） ---------- */
function petDecay(){
  const p=state.pet; if(!p||!p.last) return;
  const now=Date.now(), last=Date.parse(p.last)||now;
  let hrs=Math.max(0,(now-last)/3600000);
  if(hrs>24*7) hrs=24*7;                 // 衰减最多按 7 天算，避免久未开突然归零
  const f=Math.floor(hrs/8);              // 每 8 小时掉一档
  p.hunger=Math.max(0,p.hunger-6*f);
  p.energy=Math.max(0,p.energy-5*f);
  p.mood  =Math.max(0,p.mood  -4*f);
}
function petGainExp(n){
  const p=state.pet; p.exp=(p.exp||0)+n;
  let need=petNeed(p.level);
  while(p.exp>=need){ p.exp-=need; p.level++; need=petNeed(p.level); }
}
function petNeed(level){ return 30+(level-1)*20; }
function petTouch(act){
  const p=state.pet; petDecay();
  let line='';
  if(act==='feed'){ p.hunger=Math.min(100,p.hunger+28); p.mood=Math.min(100,p.mood+6); petGainExp(6); line='豆豆吃得很香～'; }
  else if(act==='sleep'){ p.energy=Math.min(100,p.energy+34); p.mood=Math.min(100,p.mood+5); petGainExp(5); line='豆豆睡了一觉，精神多了'; }
  else if(act==='petit'){ p.mood=Math.min(100,p.mood+9); petGainExp(2); line='豆豆被你摸得眯起了眼'; }
  p.last=new Date().toISOString(); persist(); return line;
}
function petReward(score){
  const p=state.pet; petDecay();
  const gain=Math.min(40,4+score*2);
  p.mood=Math.min(100,p.mood+Math.min(20,score)); p.energy=Math.min(100,p.energy+8); p.hunger=Math.max(0,p.hunger-6);
  petGainExp(gain); p.last=new Date().toISOString(); persist();
  return `游戏得分 ${score}！豆豆开心 +经验 ${gain}`;
}
function petStage(){
  const L=state.pet.level;
  if(L<=2) return {emoji:'🥚',name:'豆豆（幼）',desc:'破壳不久，正长身体'};
  if(L<=4) return {emoji:'🐣',name:'豆豆（成长中）',desc:'蹦蹦跳跳，精力旺盛'};
  if(L<=7) return {emoji:'🐥',name:'豆豆（成年）',desc:'稳重又粘人'};
  return {emoji:'🦉',name:'豆豆（长老）',desc:'见多识广，安静陪伴'};

/* ---------- 天气（Open-Meteo，免费、无需密钥；仅请求天气，不上传任何日记内容） ---------- */
function cityUrl(lat,lon){
  return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m`
    + `&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset`
    + `&timezone=Asia%2FShanghai&forecast_days=1`;
}
async function getJSON(url,ms=9000){
  const ac=new AbortController(), timer=setTimeout(()=>ac.abort(),ms);
  try{ const r=await fetch(url,{signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(timer); }
}
async function fetchWeather(force){
  if(weatherBusy) return; weatherBusy=true;
  const st=state.settings, cache=state.weather;
  if(!force && cache && cache.day===todayStr() && cache.city===st.city){ weatherBusy=false; paintWeather(cache.data,cache.at); return; }
  paintWeather(null,'加载中…');
  try{
    const j=await getJSON(cityUrl(st.lat,st.lon));
    const c=j.current||{}, d=j.daily||{};
    const data={
      temp:Math.round(c.temperature_2m), feel:Math.round(c.apparent_temperature),
      code:c.weather_code, hum:c.relative_humidity_2m, wind:c.wind_speed_10m,
      max:Math.round((d.temperature_2m_max||[])[0]), min:Math.round((d.temperature_2m_min||[])[0]),
      rise:(d.sunrise||[])[0]||'', set:(d.sunset||[])[0]||''
    };
    const at=`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
    state.weather={day:todayStr(),city:st.city,at,data}; persist();
    paintWeather(data,at);
  }catch(e){
    if(cache&&cache.data) paintWeather(cache.data,cache.at+'（缓存）');
    else paintWeather(null,'离线或网络不可用');
  }finally{ weatherBusy=false; }
}

function paintWeather(data,at){
  const box=$('#weatherBox'); if(!box) return;

      <span>湿度 <b>${data.hum}%</b></span><span>风 <b>${data.wind} km/h</b></span>
      <span>日出 <b>${hm(data.rise)}</b> · 日落 <b>${hm(data.set)}</b></span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">

      <span class="tiny muted">${esc(at)} 更新</span>

async function searchCity(q){
  const box=$('#cityResults'); if(!box) return;
  box.innerHTML='<span class="tiny muted">搜索中…</span>';
  try{
    const j=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`);
    const list=j.results||[];
    if(!list.length){ box.innerHTML='<span class="tiny muted">没找到，可在下方直接填经纬度，或从常用城市里选。</span>'; return; }

/* ---------- 导出 / 导入 ---------- */
function download(name,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function entryMD(s){
  const i=infoOf(s), e=state.entries[s]||{};
  const fes=i.festivals.map(f=>f.name).concat(i.term?[i.term]:[]).join('、');
  const habits=(state.settings.habits||[]).filter((h,k)=>(e.habits||[])[k]);
  const L=[];
  L.push(`## ${s} ${i.weekCN}${fes?' · '+fes:''} · ${i.lunar.text}`);
  if(e.tag) L.push(`**今日关键词**：${e.tag}`);
  if(e.wManual) L.push(`**当日天气（手记）**：${e.wManual}`);
  const t=[e.t1,e.t2,e.t3].filter(Boolean); if(t.length) L.push(`**今日三件事**\n${t.map((x,k)=>`${k+1}. ${x}`).join('\n')}`);
  if(e.note) L.push(`**今日记录**\n\n${e.note}`);
  const g=[e.g1,e.g2,e.g3].filter(Boolean); if(g.length) L.push(`**感恩三件**\n${g.map(x=>'- '+x).join('\n')}`);
  const rp=[['做得好',e.good],['可以更好',e.better],['明日最重要的一件',e.tomorrow]].filter(x=>x[1]);
  if(rp.length) L.push(`**晚间复盘**\n${rp.map(x=>`- ${x[0]}：${x[1]}`).join('\n')}`);
  const sc=[['心情',e.mood],['精力',e.energy],['睡眠',e.sleep],['运动',e.exercise],['阅读',e.reading],['支出',e.spend]].filter(x=>x[1]);
  if(sc.length) L.push(`**今日刻度**：${sc.map(x=>`${x[0]} ${x[1]}`).join(' / ')}`);
  if(habits.length) L.push(`**打卡**：${habits.join('、')}`);
  return L.join('\n\n')+'\n';
}
function exportMD(one){
  const keys=one?[one]:Object.keys(state.entries).filter(k=>hasEntry(k)).sort();
  const head=`# 2027 每日记事本 · ${one?'单日':'全年'}导出\n\n> 导出时间：${new Date().toLocaleString('zh-CN')}　|　共 ${keys.length} 天有记录　|　数据仅存于本机\n`;
  download(one?`2027日记_${one}.md`:'2027每日记事本_全年.md',
           head+'\n'+(keys.length?keys.map(entryMD).join('\n---\n\n'):'\n（还没有写过的日子）\n'),'text/markdown;charset=utf-8');
}
function exportJSON(){
  download('2027每日记事本_备份.json',JSON.stringify({v:1,exportAt:new Date().toISOString(),
    entries:state.entries,settings:state.settings,year:state.year},null,2),'application/json;charset=utf-8');
}
function importJSON(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      if(!o||typeof o.entries!=='object') throw new Error('格式不对');
      if(!confirm('导入会覆盖当前本子里的全部日记与设置，确定继续吗？\n（建议先导出一份备份）')) return;
      const d=defaultState();
      state={entries:o.entries||{},settings:Object.assign({},d.settings,o.settings||{}),
             year:Object.assign({},d.year,o.year||{}),weather:null};
      persist(); applyTheme(); render(); fetchWeather(true); toast('导入完成');
    }catch(e){ toast('导入失败：不是有效的备份文件'); }
  };
  fr.readAsText(file,'utf-8');
}
function toast(msg){
  const t=$('#toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}
function applyTheme(){
  const a=$('#app');
  a.dataset.theme=state.settings.theme||'xuan';
  a.dataset.season=state.settings.seasonAuto?seasonOf(cur.date):'none';
  $$('.theme-dot').forEach(b=>b.classList.toggle('on',b.dataset.theme===a.dataset.theme));
  /* 悬浮挂件与弹层在 .app 之外，继承不到主题变量；把当前主题色镜像到根元素，
     这样换纸色（含深色夜航）时小猴面板、宠物挂件、提示条颜色都跟着变。 */
  try{
    if(typeof getComputedStyle!=='function') return;
    const cs=getComputedStyle(a);
    ['--bg','--paper','--card','--ink','--ink2','--ink3','--line','--accent','--accent-soft','--gold','--side','--shadow','--season']
      .forEach(k=>{ const v=cs.getPropertyValue(k).trim(); if(v) document.documentElement.style.setProperty(k,v); });
  }catch(e){ /* 老浏览器忽略，:root 兜底值仍生效 */ }
}

/* ---------------- 月视图 ---------------- */
function monthStat(m){
  const pre=`${YEAR}-${pad(m)}-`, keys=Object.keys(state.entries).filter(k=>k.startsWith(pre)&&hasEntry(k));
  const chars=keys.reduce((n,k)=>n+textFields(k),0);
  const moods=keys.map(k=>Number(state.entries[k].mood)||0).filter(Boolean);
  const avg=moods.length?(moods.reduce((a,b)=>a+b,0)/moods.length).toFixed(1):'—';
  return {days:keys.length,chars,avg};
}
function renderMonth(){
  const m=cur.month, first=`${YEAR}-${pad(m)}-01`, wd=toDate(first).getDay();
  const dim=new Date(YEAR,m,0).getDate(), st=monthStat(m);
  let cells='';
  for(let k=0;k<wd;k++) cells+=`<div class="cell blank"></div>`;
  for(let d=1;d<=dim;d++){
    const s=`${YEAR}-${pad(m)}-${pad(d)}`, i=infoOf(s);
    const f=i.festivals.find(x=>x.kind==='big'||x.kind==='trad')||i.festivals[0];
    const label=f?f.name:(i.term||i.lunar.dayCN);
    cells+=`<button class="cell ${i.holiday?'holiday':''} ${i.makeup?'makeup':''} ${s===cur.date?'sel':''} ${s===todayStr()?'today':''}"
      data-act="goto" data-date="${s}">

      ${hasEntry(s)?'<span class="dot"></span>':''}
      <span class="d-fest">${esc(label)}</span></button>`;
  }
  $('#view').innerHTML=`
  <div class="month-head">
    <div class="month-title">${m} 月 <span>${m===1?'JANUARY':['','JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][m]}</span></div>

  <div class="card" style="padding:2px">

}

const REV_MONTH_EN=['','JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

    title='本周复盘'; rangeLabel=`${ws} ～ ${addDays(ws,6)}（周一至周日）`; }
  else{ days=monthDates(cur.month); key='M'+`${YEAR}-${pad(cur.month)}`; title=`${cur.month} 月复盘`; rangeLabel=`${YEAR}-${pad(cur.month)}`; }
