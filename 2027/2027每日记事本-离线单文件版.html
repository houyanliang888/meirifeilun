function renderBook(){
  const written=Object.keys(state.entries).filter(hasEntry).sort();
  if(!written.length){
    $('#view').innerHTML=`<div class="month-head"><div class="month-title">年度纸质书 <span>BOOK</span></div></div>
      <div class="card" style="padding:34px;text-align:center"><div class="muted">还没有写过的日子。<br>先去书写页写几天，再回来生成你的 2027 年度书。</div>
      <button class="btn primary" data-act="goto-today-write" style="margin-top:16px">✎ 写今天</button></div>`; return;
  }
  const y=state.year, totalChars=written.reduce((n,k)=>n+textFields(k),0);
  let html=`<div class="book">`;
  html+=`<div class="book-cover">
      <div class="bc-kicker">${y.keyword?esc(y.keyword):'我的 2027'}</div>
      <div class="bc-title">2027 年度记事本</div>
      <div class="bc-sub">丁未年 · 一天一页 · 写下来就好</div>
      <div class="bc-meta">共 ${written.length} 天有记录　·　${totalChars} 字</div>
      <div class="bc-wish">${y.wish?('「'+esc(y.wish)+'」'):'愿这一年，认真生活，慢慢变好。'}</div>
      <div class="bc-foot"><span>署名：${y.name?esc(y.name):'____________'}</span><span>城市：${esc(state.settings.city)||'____________'}</span></div>
    </div>`;
  html+=`<div class="book-page"><h2 class="bp-h">写在前面</h2>
      <div class="bp-block"><b>年度关键词</b><p>${esc(y.keyword)||'（未填）'}</p></div>
      <div class="bp-block"><b>今年想做成的事</b><p>${(esc(y.goals)||'（未填）').replace(/\n/g,'<br>')}</p></div>
      <div class="bp-block"><b>年末回头看</b><p>${(esc(y.review)||'（留到 12 月再写）').replace(/\n/g,'<br>')}</p></div>
    </div>`;
  for(let m=1;m<=12;m++){
    const days=monthDates(m).filter(hasEntry); if(!days.length) continue;
    const st=monthStat(m);
    html+=`<div class="book-month"><h2 class="bm-h">${m} 月 · ${REV_MONTH_EN[m]}</h2>
      <div class="bm-sub">本月 ${st.days} 天有记录 · 平均心情 ${st.avg}</div>`;
    days.forEach(s=>{
      const i=infoOf(s), e=state.entries[s], p=poemOf(i), q=quoteOf(i), ws=wordsOf(i,6);
      const fes=i.festivals.map(f=>f.name).concat(i.term?[i.term]:[]).join('、');
      html+=`<div class="bd">
        <div class="bd-h"><span class="bd-d">${pad(i.day)}</span><span class="bd-w">${i.weekCN}</span>
          ${fes?`<span class="bd-f">${esc(fes)}</span>`:''}<span class="bd-l">${i.lunar.text}</span></div>
        <div class="bd-content">
          <div class="bd-side">
            <div class="bd-poem"><b>${esc(p.t)}</b>　<em>${esc(p.a)}</em><br><span>${esc(p.d)}</span></div>
            <div class="bd-quote">「${esc(q.q)}」— ${esc(q.s)}</div>
            <div class="bd-words">${ws.map(w=>`${esc(w.w)} <i>${esc(w.pos)}</i> ${esc(w.cn)}`).join('<br>')}</div>
          </div>
          <div class="bd-main">${dayBookHTML(e)}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;
  $('#view').innerHTML=html;
}

/* ---------------- 回顾 / 查询（有记录的日子） ---------------- */
function renderMemo(){
  const all=Object.keys(state.entries).filter(hasEntry).sort().reverse();
  const q=memoQ.trim().toLowerCase();
  const filtered=all.filter(k=>{
    if(memoMonth && k.slice(5,7)!==pad(memoMonth)) return false;
    if(q){ const e=state.entries[k]; return Object.keys(e).some(f=>typeof e[f]==='string'&&e[f].toLowerCase().includes(q)); }
    return true;
  });
  const months=[...new Set(all.map(k=>Number(k.slice(5,7))))].sort((a,b)=>a-b);
  const chips=`<button class="btn sm ${memoMonth===0?'primary':''}" data-act="memo-m" data-m="0">全部</button>`
    + months.map(m=>`<button class="btn sm ${memoMonth===m?'primary':''}" data-act="memo-m" data-m="${m}">${m}月</button>`).join('');
  const monthsHTML = months.map(m=>{
    const days=all.filter(k=>k.slice(5,7)===pad(m));
    return `<div class="memo-sec"><div class="memo-sec-h">${m} 月 <span>${days.length} 天</span></div>
      <div class="memo-grid">${days.slice().reverse().map(k=>memoCard(k)).join('')}</div></div>`;
  }).join('');
  $('#view').innerHTML=`
  <div class="month-head"><div class="month-title">回顾 · 查询 <span>MEMO</span></div>
    <div class="tiny muted">这里汇总了所有写过的日子，点任意一张回到那一天；可按月份筛选或搜索关键词。</div></div>
  <div class="card" style="padding:14px 16px;margin-bottom:16px">
    <div class="memo-bar">
      <input id="memoInput" type="text" placeholder="搜关键词（如：方案、跑步、客户）…" value="${esc(memoQ)}">
      <button class="btn sm" data-act="memo-search">搜索</button>
      <button class="btn sm ghost" data-act="memo-clear">清空</button>
    </div>
    <div class="chips" style="margin-top:10px">${chips}</div>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="v">${all.length}</div><div class="k">已写天数 / 365</div></div>
    <div class="stat"><div class="v">${filtered.length}</div><div class="k">当前筛选结果</div></div>
    <div class="stat"><div class="v">${streakOf(todayStr())}</div><div class="k">当前连续天数</div></div>
  </div>
  ${filtered.length?monthsHTML:`<div class="card" style="padding:30px;text-align:center" class="muted">没有匹配的记录。换个关键词或月份试试。</div>`}`;
}
function memoCard(k){
  const i=infoOf(k), e=state.entries[k];
  const mood=e.mood?`<span class="mc-mood">${'★'.repeat(Number(e.mood))}${'☆'.repeat(5-Number(e.mood))}</span>`:'';
  const snip=[e.note,e.tag,e.good,e.tomorrow].filter(Boolean).join('　').slice(0,46);
  return `<div class="memo-card" data-act="goto" data-date="${k}">
    <div class="mc-top"><span class="mc-d">${pad(i.day)}</span><span class="mc-w">${i.weekCN.slice(2)}</span>${mood}</div>
    <div class="mc-sub">${i.lunar.text}${i.term?' · '+esc(i.term):''}</div>
    <div class="mc-snip">${esc(snip||'（仅打卡）')}</div></div>`;
}

function monkeySearch(q){
  q=(q||'').trim().toLowerCase();
  const res={diary:[],poem:[],quote:[],word:[],history:[],skill:[]};
  if(!q) return res;
  Object.keys(state.entries).filter(hasEntry).forEach(k=>{
    const e=state.entries[k];
    const txt=Object.keys(e).filter(f=>typeof e[f]==='string').map(f=>e[f]).join(' ').toLowerCase();
    if(txt.indexOf(q)>=0) res.diary.push({date:k, snip:diarySnippet(k,q)});
  });
  POEMS.forEach(p=>{ const txt=(p.t+' '+(p.a||'')+' '+(p.d||'')+' '+p.c.join(' ')).toLowerCase(); if(txt.indexOf(q)>=0) res.poem.push(p); });
  QUOTES.forEach(qu=>{ const txt=((qu.q||'')+' '+(qu.s||'')).toLowerCase(); if(txt.indexOf(q)>=0) res.quote.push(qu); });
  WORDS.forEach(s=>{ if(s.toLowerCase().indexOf(q)>=0) res.word.push(s); });
  Object.keys(HISTORY).forEach(md=>HISTORY[md].forEach(h=>{ if(((h.y||'')+' '+(h.t||'')).toLowerCase().indexOf(q)>=0) res.history.push({md:md,h:h}); }));
  KNOWLEDGE.forEach(s=>{ if(((s.c||'')+' '+(s.t||'')+' '+(s.b||'')).toLowerCase().indexOf(q)>=0) res.skill.push(s); });
  return res;
}
function diarySnippet(k,q){
  const e=state.entries[k];
  const full=[e.note,e.tag,e.good,e.better,e.tomorrow,e.t1,e.t2,e.t3].filter(Boolean).join(' ');
  const idx=full.toLowerCase().indexOf(q);
  if(idx<0) return full.slice(0,42);
  return (idx>12? '…'+full.slice(idx-12,idx+30): full.slice(0,42));
}
function monkeyResultsHTML(res,q){
  const sec=(title,arr,fn)=> arr.length? `<div class="mk-sec"><div class="mk-sec-h">${title} · ${arr.length}</div>${arr.slice(0,10).map(fn).join('')}</div>`:'';
  let html='';
  html+=sec('我的日记', res.diary, x=>`<div class="mk-item mk-diary" data-act="goto" data-date="${x.date}"><b>${x.date.slice(5)}</b>　<span>${esc(x.snip)}</span></div>`);
  html+=sec('古诗词', res.poem, p=>`<div class="mk-item"><b>${esc(p.t)}</b>　<em>${esc(p.a)}</em><br><span>${esc(p.c[0]||'')}</span></div>`);
  html+=sec('金句', res.quote, q2=>`<div class="mk-item">「${esc(q2.q)}」— ${esc(q2.s)}</div>`);
  html+=sec('单词', res.word, s=>{const r=s.split('|');return `<div class="mk-item"><b>${esc(r[0])}</b> <i>${esc(r[1])}</i> ${esc(r[2])}<br><span>${esc(r[3]||'')}</span></div>`;});
  html+=sec('历史上的今天', res.history, x=>`<div class="mk-item"><b>${esc(x.h.y)}</b>　${esc(x.h.t)}</div>`);
  html+=sec('每日一技', res.skill, s=>`<div class="mk-item"><b>[${esc(s.c)}] ${esc(s.t)}</b><br><span>${esc(s.b)}</span></div>`);
  if(!html) html=`<div class="mk-empty">没有找到「${esc(q)}」相关的内容。<br>换个词试试，或点上方按钮快速调取今日信息。</div>`;
  return html;
}
function monkeyToday(kind){
  if(kind==='weather'){
    const w=state.weather&&state.weather.data;
    if(!w) return `<div class="mk-sec"><div class="mk-sec-h">今日天气 · ${esc(state.settings.city)}</div>
      <div class="mk-empty">暂无天气数据（离线或还没刷新）。回到「今日书写」点天气条刷新即可；也可以在天气条下方「手记天气」自己记一笔。</div></div>`;
    const c=WEATHER_CODES[w.code]||['未知','🌡'];
    return `<div class="mk-sec"><div class="mk-sec-h">今日天气 · ${esc(state.settings.city)}</div>
      <div class="mk-item"><b style="font-size:20px">${c[1]} ${w.temp}°</b>　${esc(c[0])}<br>
      <span>最高 ${w.max}° / 最低 ${w.min}°　·　体感 ${w.feel}°　·　湿度 ${w.hum}%　·　风 ${w.wind} km/h</span></div>
      <div class="mk-empty" style="padding:4px 2px">数据来自 Open-Meteo 免费接口 · ${esc(state.weather.at||'')} 更新</div></div>`;
  }
  const i=infoOf(cur.date);
  if(kind==='poem'){ const p=poemOf(i); return `<div class="mk-sec"><div class="mk-sec-h">今日诗词</div><div class="mk-item"><b>${esc(p.t)}</b>　<em>${esc(p.a)}</em><br><span>${p.c.map(esc).join('<br>')}</span></div></div>`; }
  if(kind==='quote'){ const q=quoteOf(i,quoteShift); return `<div class="mk-sec"><div class="mk-sec-h">今日金句</div><div class="mk-item">「${esc(q.q)}」— ${esc(q.s)}</div></div>`; }
  if(kind==='word'){ const ws=wordsOf(i,6); return `<div class="mk-sec"><div class="mk-sec-h">今日单词</div>${ws.map(w=>`<div class="mk-item"><b>${esc(w.w)}</b> <i>${esc(w.pos)}</i> ${esc(w.cn)}<br><span>${esc(w.ex||'')}</span></div>`).join('')}</div>`; }
  if(kind==='history'){ const list=historyOf(pad(i.month)+'-'+pad(i.day)); return `<div class="mk-sec"><div class="mk-sec-h">历史上的今天 · ${pad(i.month)}-${pad(i.day)}</div>${list.length?list.map(h=>`<div class="mk-item"><b>${esc(h.y)}</b>　${esc(h.t)}</div>`).join(''):'<div class="mk-empty">暂无收录</div>'}</div>`; }
  if(kind==='skill'){ const s=knowledgeOf(i.doy); return `<div class="mk-sec"><div class="mk-sec-h">每日一技 · ${esc(s.c)}</div><div class="mk-item"><b>${esc(s.t)}</b><br><span>${esc(s.b)}</span></div></div>`; }
  return '';
}
function monkeyDiaryList(){
  const all=Object.keys(state.entries).filter(hasEntry).sort().reverse();
  if(!all.length) return `<div class="mk-empty">还没有写过的日子。去书写页写几天再来查。</div>`;
  return `<div class="mk-sec"><div class="mk-sec-h">我的全部记录 · ${all.length} 天</div><div class="mk-grid">${all.map(k=>{const i=infoOf(k),e=state.entries[k];const mood=e.mood?'★'.repeat(Number(e.mood)):'';return `<div class="mk-card" data-act="goto" data-date="${k}"><b>${pad(i.month)}/${pad(i.day)}</b><span>${i.weekCN.slice(2)}</span>${mood?`<i>${mood}</i>`:''}</div>`;}).join('')}</div></div>`;
}

/* 接星星小游戏：30 秒，点中越多经验越多（纯本地，无联网） */
let petGame={timer:null,spawn:null,score:0,end:0,running:false};
function petGameOpen(){
  if(petGame.running) return;
  const box=$('#petGame'); if(!box) return;
  petGame={timer:null,spawn:null,score:0,end:Date.now()+30000,running:true};
  box.hidden=false;
  box.innerHTML=`<div class="pg-panel">
    <div class="pg-head"><b>接星星 · 30 秒</b><button class="btn sm ghost" data-act="pet-game-close">✕</button></div>
    <div class="pg-score">得分 <b id="pgScore">0</b>　·　剩 <b id="pgTime">30</b> 秒</div>
    <div class="pg-field" id="pgField"></div>
    <div class="pg-tip">点中掉落的星星！手快得分高，豆豆更开心。</div></div>`;
  const field=$('#pgField');
  petGame.spawn=setInterval(()=>{
    if(!petGame.running) return;
    const st=document.createElement('button');
    st.className='pg-star'; st.dataset.act='pet-game-hit';
    st.textContent=Math.random()<0.18?'⭐':'✨';
    st.style.left=(8+Math.random()*82)+'%'; st.style.top=(8+Math.random()*72)+'%';
    st.style.animationDuration=(0.9+Math.random()*0.7)+'s';
    field.appendChild(st);
    setTimeout(()=>{ if(st.parentNode) st.remove(); }, 1150);
  }, 620);
  petGame.timer=setInterval(()=>{
    const left=Math.max(0,Math.round((petGame.end-Date.now())/1000));
    const te=$('#pgTime'); if(te) te.textContent=left;
    if(left<=0) petGameEnd();
  }, 250);
}
function petGameHit(t){
  petGame.score++; const sc=$('#pgScore'); if(sc) sc.textContent=petGame.score;
  if(t&&t.parentNode) t.remove();
  const pop=document.createElement('span'); pop.className='pg-pop'; pop.textContent='+1';
  const f=$('#pgField'); if(f){ pop.style.left=(8+Math.random()*82)+'%'; pop.style.top=(8+Math.random()*72)+'%'; f.appendChild(pop); setTimeout(()=>pop.remove(),500); }
}
function petGameEnd(){
  if(!petGame.running) return; petGame.running=false;
  clearInterval(petGame.timer); clearInterval(petGame.spawn);
  const msg=petReward(petGame.score);
  const box=$('#petGame'); const f=$('#pgField');
  if(f) f.innerHTML=`<div class="pg-result"><div class="pg-r-score">${petGame.score}</div><div class="pg-r-sub">${esc(msg)}</div>
    <button class="btn primary" data-act="pet-game-close">收下奖励</button></div>`;
  renderPetWidget();
}
function petGameClose(){
  petGame.running=false; clearInterval(petGame.timer); clearInterval(petGame.spawn);
  const box=$('#petGame'); if(box) box.hidden=true;
}

  renderNav(); applyTheme(); renderCrumb(); renderTools();
  ({day:renderDay,month:renderMonth,year:renderYear,settings:renderSettings,search:renderSearch,
     review:renderReview,trend:renderTrend,book:renderBook,memo:renderMemo,pet:renderPet}[cur.view]||renderDay)();
  renderPetWidget(); renderMonkeyDock();
  syncHash();
}
/* 地址栏书签：#2027-06-09 直达某天，#month-9 月历，#year 全年，#settings 设置 */
function hashFor(){
  if(cur.view==='day') return '#'+cur.date;
  if(cur.view==='month') return '#month-'+cur.month;
  return '#'+cur.view;
}
function syncHash(){
  try{ if(location.hash!==hashFor()) history.replaceState(null,'',hashFor()); }catch(e){}
}
function readHash(){
  const h=(location.hash||'').slice(1);
  if(/^2027-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(h) && isoOf(toDate(h))===h){
    cur.date=h; cur.month=Number(h.slice(5,7)); cur.view='day'; return true;
  }
  if(h==='year'||h==='settings'||h==='review'||h==='trend'||h==='book'||h==='memo'||h==='pet'){ cur.view=h; return true; }
  if(/^month-(\d{1,2})$/.test(h)){
    const m=Number(h.slice(6));
    if(m>=1&&m<=12){ cur.month=m; cur.view='month'; cur.date=`${YEAR}-${pad(m)}-01`; return true; }
  }
  return false;
}
window.addEventListener('hashchange',()=>{ if(readHash()) render(); });

/* ---------------- 事件 ---------------- */
function go(date,view){
  cur.date=clampYear(date); cur.month=Number(cur.date.slice(5,7)); cur.view=view||'day';
  quoteShift=0; wordCountShown=6;
  const panel=$('#cityPanel'); if(panel) panel.innerHTML='';
  closeMenu(); render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  switch(a){
    case 'day-tab': setDayTab(t.dataset.tab); break;
    case 'menu-open': openMenu(); break;
    case 'menu-close': closeMenu(); break;
    case 'install-app': closeMenu();
      if(typeof window.diaryInstall==='function') window.diaryInstall();
      else toast('线上版可在浏览器菜单选「添加到主屏幕」'); break;
    case 'goto': go(t.dataset.date,'day'); break;
    case 'today': go(todayStr(),'day'); break;
    case 'goto-today-write': go(todayStr(),'day'); setTimeout(()=>{const el=$('textarea[data-f="note"]'); if(el) el.focus();},60); break;
    case 'month': {
      const m=Number(t.dataset.m); if(m<1||m>12) break;
      cur.month=m; cur.view='month'; cur.date=`${YEAR}-${pad(m)}-01`; render(); break;
    }
    case 'theme': state.settings.theme=t.dataset.theme; persist(); applyTheme();
      if(cur.view==='settings') render();
      toast('纸色已换：'+(THEMES.find(x=>x[0]===t.dataset.theme)||[])[1]); break;
    case 'go-settings': cur.view='settings'; render(); break;
    case 'quote-next': quoteShift=(quoteShift+1)%QUOTES.length; render(); break;
    case 'quote-tiandao': {
      const len=QUOTES.length, start=QUOTES.findIndex(q=>q.t==='tiandao');
      const tiandaoCount=QUOTES.filter(q=>q.t==='tiandao').length;
      const base=(infoOf(cur.date).doy-1)%len;
      const k=Math.floor(Math.random()*tiandaoCount);
      quoteShift=(start+k-base+len*4)%len;
      render(); break;
    }
    case 'words-more': wordCountShown=wordCountShown<10?Math.min(10,wordCountShown+2):6; render(); break;
    case 'word-toggle': t.classList.toggle('open'); break;
    case 'review-week': cur.reviewKind='week'; render(); break;
    case 'review-month': cur.reviewKind='month'; render(); break;
    case 'star': {
      entry(cur.date)[t.dataset.f]=Number(t.dataset.v);
      $$(`[data-stars="${t.dataset.f}"] .star`).forEach(b=>b.classList.toggle('on',Number(b.dataset.v)<=Number(t.dataset.v)));
      scheduleSave(); break;
    }
    case 'print': window.print(); break;
    case 'md-one': exportMD(cur.date); toast('本日 Markdown 已导出'); break;
    case 'md-all': exportMD(null); toast('全年 Markdown 已导出'); break;
    case 'backup': exportJSON(); toast('JSON 备份已导出'); break;
    case 'import': $('#importFile').click(); break;
    case 'clear': {
      if(confirm('⚠️ 将清空 2027 全部日记与年度文字（设置保留），此操作不可撤销。\n建议先导出 JSON 备份。确定清空吗？')
         && confirm('再确认一次：真的要清空全部日记吗？')){
        state.entries={}; state.year={keyword:'',goals:'',review:'',name:'',wish:''}; persist(); render(); toast('已清空');
      }
      break;
    }
    case 'weather-retry': fetchWeather(true); break;
    case 'wmanual-edit': paintManual(true); setTimeout(()=>{const el=$('#wManualInput'); if(el) el.focus();},30); break;
    case 'wmanual-cancel': paintManual(false); break;
    case 'wmanual-save': {
      const el=$('#wManualInput'); entry(cur.date).wManual=el?el.value.trim():'';
      scheduleSave(); paintManual(false); toast('当日天气已记下'); break;
    }
    case 'wmanual-clear': entry(cur.date).wManual=''; scheduleSave(); paintManual(false); break;
    case 'city-menu': toggleCityPanel(); break;
    case 'city-search': {
      const q=($('#cityQuery')||{}).value||''; if(q.trim()) searchCity(q.trim()); else toast('先输入地名'); break;
    }
    case 'pick-geo': {
      state.settings.city=t.dataset.name; state.settings.lat=Number(t.dataset.lat); state.settings.lon=Number(t.dataset.lon);
      state.weather=null; persist(); render(); fetchWeather(true); toast('城市已切换为 '+t.dataset.name); break;
    }
    case 'city-quick': {
      const c=CITIES.find(x=>x[0]===t.dataset.name); if(!c) break;
      state.settings.city=c[0]; state.settings.lat=c[1]; state.settings.lon=c[2]; state.weather=null;
      persist(); render(); fetchWeather(true); toast('已设为默认城市：'+c[0]); break;
    }
    case 'monkey-open': monkeyOpen(); break;
    case 'monkey-close': { const ov=document.getElementById('monkeyPanel'); if(ov) ov.hidden=true; break; }
    case 'monkey-search': { const inp=document.getElementById('monkeyInput'); monkeyState.q=inp?inp.value:''; monkeyState.mode='search'; renderMonkeyPanel(); break; }
    case 'monkey-diary': monkeyState.mode='diary'; renderMonkeyPanel(); break;
    case 'monkey-today': monkeyState.mode='today'; monkeyState.todayKind=t.dataset.k; renderMonkeyPanel(); break;
    case 'monkey-date': monkeyState.mode='date'; renderMonkeyPanel(); break;
    case 'monkey-back': monkeyState.mode='search'; renderMonkeyPanel(); break;
    case 'monkey-godate': { const d=(document.getElementById('monkeyDate')||{}).value; const ov=document.getElementById('monkeyPanel'); if(ov) ov.hidden=true; if(d) go(d,'day'); break; }
    case 'mk-stop': break;
    case 'go-pet': cur.view='pet'; render(); break;
    case 'pet-feed': { const m=petTouch('feed'); renderPet(); renderPetWidget(); toast(m); break; }
    case 'pet-sleep': { const m=petTouch('sleep'); renderPet(); renderPetWidget(); toast(m); break; }
    case 'pet-petit': { const m=petTouch('petit'); renderPet(); renderPetWidget(); toast(m); break; }
    case 'pet-rename': {
      const n=(window.prompt?window.prompt('给豆豆起个名字：',state.pet.name||'豆豆'):null);
      if(n&&n.trim()){ state.pet.name=n.trim(); persist(); renderPet(); renderPetWidget(); toast('以后就叫'+state.pet.name+'啦'); }
      break;
    }
    case 'pet-game-open': petGameOpen(); break;
    case 'pet-game-close': petGameClose(); break;
    case 'pet-game-hit': petGameHit(t); break;
    case 'memo-m': memoMonth=Number(t.dataset.m); render(); break;
    case 'memo-search': memoQ=(($('#memoInput')||{}).value||'').trim(); render(); break;
    case 'memo-clear': memoQ=''; memoMonth=0; render(); break;
    default: break;
  }
});
/* 侧栏导航 */
document.addEventListener('click',e=>{
  const b=e.target.closest('#nav button[data-view], #menuPanel [data-view]'); if(!b) return;
  cur.view=b.dataset.view; $('#cityPanel')&&($('#cityPanel').innerHTML='');
  if(cur.view==='month') cur.month=Number(cur.date.slice(5,7));
  closeMenu(); render();
});
/* 输入 */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){
    entry(cur.date)[t.dataset.f]=t.value;
    if(t.dataset.f==='note'){ const c=$('#noteCount'); if(c) c.textContent=t.value.length+' 字'; }
    scheduleSave(); return;
  }
  if(t.dataset.y){ state.year[t.dataset.y]=t.value; scheduleSave(); return; }
  if(t.dataset.rf){ const i=t.dataset.rf.indexOf('|'); const k=t.dataset.rf.slice(0,i), f=t.dataset.rf.slice(i+1);
    state.reviews[k]=Object.assign({},state.reviews[k]||{},{[f]:t.value}); scheduleSave(); return; }
  if(t.dataset.habit!==undefined){ state.settings.habits[Number(t.dataset.habit)]=t.value; scheduleSave(); return; }
  if(t.id==='searchInput'){ /* 回车搜索，见下 */ }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.h!==undefined){
    const hs=entry(cur.date).habits||[]; hs[Number(t.dataset.h)]=t.checked; entry(cur.date).habits=hs;
    t.closest('.habit').classList.toggle('on',t.checked); scheduleSave(); return;
  }
  if(t.dataset.set==='seasonAuto'){ state.settings.seasonAuto=t.checked; persist(); applyTheme(); return; }
  if(t.dataset.set==='city' && t.value){
    const c=CITIES.find(x=>x[0]===t.value);
    if(c){ state.settings.city=c[0]; state.settings.lat=c[1]; state.settings.lon=c[2]; state.weather=null;
           persist(); render(); fetchWeather(true); toast('城市已切换为 '+c[0]); }
    return;
  }
  if(t.dataset.set==='lat'||t.dataset.set==='lon'){
    state.settings[t.dataset.set]=Number(t.value); persist(); return;
  }
  if(t.id==='importFile'&&t.files&&t.files[0]){ importJSON(t.files[0]); t.value=''; }
});
document.addEventListener('keydown',e=>{
  const s=document.activeElement;
  if(e.key==='Enter'&&s&&(s.id==='searchInput'||s.id==='menuSearchInput')){
    const q=s.value.trim(); if(!q) return; cur.query=q; cur.view='search'; closeMenu(); render(); return;
  }
  const mi=$('#memoInput');
  if(e.key==='Enter'&&document.activeElement===mi){
    memoQ=(mi.value||'').trim(); render(); return;
  }
  const mki=$('#monkeyInput');
  if(e.key==='Enter'&&document.activeElement===mki){
    e.preventDefault(); monkeyState.q=(mki.value||'').trim(); monkeyState.mode='search'; renderMonkeyPanel(); return;
  }
  if(e.key==='Escape'){
    const mn=$('#menuPanel'); if(mn&&!mn.hidden){ closeMenu(); return; }
    const mp=$('#monkeyPanel'); if(mp&&!mp.hidden){ mp.hidden=true; return; }
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); persist(); toast('已保存到本机'); return; }
  const tag=(document.activeElement||{}).tagName;
  if(cur.view==='day'&&!['INPUT','TEXTAREA','SELECT'].includes(tag)){
    if(e.key==='ArrowLeft'&&cur.date>`${YEAR}-01-01`) go(addDays(cur.date,-1),'day');
    if(e.key==='ArrowRight'&&cur.date<`${YEAR}-12-31`) go(addDays(cur.date,1),'day');
  }
});
/* 打印镜像：把 textarea 内容复制成可打印的 div */
window.addEventListener('beforeprint',()=>{
  $$('#view .day-panel').forEach(p=>{ p.hidden=false; });
  $$('textarea').forEach(t=>{
    if(t.nextElementSibling&&t.nextElementSibling.classList.contains('print-only')) return;
    const d=document.createElement('div'); d.className='print-only'; d.textContent=t.value||'';
    t.after(d);
  });
});
window.addEventListener('afterprint',()=>{ $$('.print-only').forEach(d=>d.remove()); applyDayTab(); });

/* ---------------- 联网 / 单机 状态指示 ---------------- */
function updateNet(){
  const dot=$('#netDot'); if(!dot) return;
  const on=navigator.onLine!==false;
  dot.className='net-dot '+(on?'on':'off');
  dot.title= on?'已联网 · 天气可实时获取':'离线模式 · 除天气外全部可用';
}
window.addEventListener('online',()=>{ updateNet(); fetchWeather(true); });
window.addEventListener('offline',updateNet);

/* ---------------- 启动 ---------------- */
function boot(){
  readHash();
  petDecay(); persist();
  markSaved(true);
  render();
  updateNet();
  fetchWeather(false);
}
boot();

})();</script>
</body>
