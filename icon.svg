<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#14263e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- 飞轮：四段橙色弧 -->
  <g fill="none" stroke="#ff7a3d" stroke-width="26" stroke-linecap="round" opacity="0.95">
    <path d="M256 96 A160 160 0 0 1 396 176"/>
    <path d="M416 256 A160 160 0 0 1 336 396"/>
    <path d="M256 416 A160 160 0 0 1 116 336"/>
    <path d="M96 256 A160 160 0 0 1 176 116"/>
  </g>

  <!-- 四个节点 -->
  <g fill="#ffffff">
    <circle cx="256" cy="96" r="30"/>
    <circle cx="416" cy="256" r="30"/>
    <circle cx="256" cy="416" r="30"/>
    <circle cx="96" cy="256" r="30"/>
  </g>

  <!-- 中心表盘 -->
  <circle cx="256" cy="256" r="92" fill="rgba(255,122,61,0.16)" stroke="#ff7a3d" stroke-width="6"/>

  <!-- 中心「做」字（宋体风） -->
  <text x="256" y="256" font-size="112" font-family="Songti SC, Noto Serif SC, SimSun, serif"
        font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">做</text>
</svg>
